<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- WATERY/WEAK COFFEE — pale, thin, drowning in water -->
  <ellipse cx="32" cy="60" rx="18" ry="2.5" fill="#1a1108" opacity="0.3"/>
  <!-- water drops around -->
  <path d="M 8 18 Q 10 22 10 24 Q 6 22 8 18 Z" fill="#88bbee" opacity="0.7"/>
  <path d="M 54 14 Q 56 18 56 20 Q 52 18 54 14 Z" fill="#88bbee" opacity="0.7"/>
  <path d="M 50 50 Q 52 54 52 56 Q 48 54 50 50 Z" fill="#88bbee" opacity="0.7"/>
  <!-- mug body — clear/translucent look -->
  <path d="M 16 22 L 18 56 Q 18 60 22 60 L 42 60 Q 46 60 46 56 L 48 22 Z" fill="#fff" stroke="#1a1108" stroke-width="2" opacity="0.6"/>
  <!-- handle -->
  <path d="M 46 28 Q 58 30 58 40 Q 58 50 46 50" fill="none" stroke="#1a1108" stroke-width="2.5" opacity="0.7"/>
  <!-- pale watery coffee -->
  <path d="M 18 28 L 20 56 Q 20 58 22 58 L 42 58 Q 44 58 44 56 L 46 28 Z" fill="#d8c8a8" opacity="0.65"/>
  <!-- water surface ripples -->
  <ellipse cx="32" cy="28" rx="14" ry="2.5" fill="#c8b890" opacity="0.7"/>
  <ellipse cx="32" cy="28" rx="9" ry="1.5" fill="#a89870" opacity="0.5"/>
  <ellipse cx="28" cy="32" rx="3" ry="0.5" fill="#fff" opacity="0.6"/>
  <!-- big WATER drop on top suggesting dilution -->
  <path d="M 32 4 Q 38 14 38 18 Q 38 24 32 24 Q 26 24 26 18 Q 26 14 32 4 Z" fill="#88bbee" stroke="#1a1108" stroke-width="1.5"/>
  <ellipse cx="30" cy="14" rx="2" ry="3" fill="#fff" opacity="0.7"/>
  <!-- sad face on cup -->
  <circle cx="24" cy="42" r="1.5" fill="#1a1108"/>
  <circle cx="40" cy="42" r="1.5" fill="#1a1108"/>
  <path d="M 26 50 Q 32 46 38 50" fill="none" stroke="#1a1108" stroke-width="1.5" stroke-linecap="round"/>
  <!-- "WEAK" label -->
  <rect x="22" y="34" width="20" height="6" fill="#fff8f0" stroke="#1a1108" stroke-width="1" opacity="0.9"/>
  <text x="32" y="39" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#c8302c">WEAK</text>
</svg>
