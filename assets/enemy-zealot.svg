<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- MR. WISHY-WASHY — pale watery cup with HUGE blue water drops, "WEAK!" tag -->
  <defs>
    <pattern id="ht-weak" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#000" opacity="0.3"/>
    </pattern>
  </defs>
  <ellipse cx="64" cy="120" rx="40" ry="5" fill="#000" opacity="0.6"/>
  <!-- floating water drops (the "watered down" idea made literal) -->
  <path d="M 14 30 Q 18 38 18 42 Q 10 38 14 30 Z" fill="#88bbee" stroke="#000" stroke-width="3"/>
  <path d="M 110 22 Q 114 30 114 34 Q 106 30 110 22 Z" fill="#88bbee" stroke="#000" stroke-width="3"/>
  <path d="M 100 100 Q 104 108 104 112 Q 96 108 100 100 Z" fill="#88bbee" stroke="#000" stroke-width="3"/>
  <!-- mug body — chunky outline -->
  <path d="M 26 46 L 32 116 Q 32 122 38 122 L 90 122 Q 96 122 96 116 L 102 46 Z" fill="#fff" stroke="#000" stroke-width="5"/>
  <!-- shadow on right -->
  <path d="M 96 46 L 90 122 Q 96 122 96 116 Z" fill="url(#ht-weak)"/>
  <!-- handle -->
  <path d="M 96 60 Q 116 64 116 84 Q 116 104 96 104" fill="none" stroke="#000" stroke-width="5"/>
  <!-- pale watery coffee inside -->
  <path d="M 32 58 L 36 116 Q 36 120 40 120 L 88 120 Q 92 120 92 116 L 96 58 Z" fill="#dcc8a8"/>
  <!-- water level / surface -->
  <ellipse cx="64" cy="58" rx="32" ry="5" fill="#bca888" stroke="#000" stroke-width="3"/>
  <!-- BIG water drop on top (literal "watered down") -->
  <path d="M 64 4 Q 80 24 80 36 Q 80 50 64 50 Q 48 50 48 36 Q 48 24 64 4 Z" fill="#88bbee" stroke="#000" stroke-width="4"/>
  <text x="64" y="34" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" font-weight="bold" fill="#000">H₂O</text>
  <!-- highlight on water drop -->
  <ellipse cx="58" cy="22" rx="4" ry="8" fill="#fff" opacity="0.8"/>
  <!-- sad face on cup -->
  <circle cx="48" cy="84" r="5" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="80" cy="84" r="5" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="48" cy="86" r="2.5" fill="#000"/>
  <circle cx="80" cy="86" r="2.5" fill="#000"/>
  <path d="M 48 102 Q 64 96 80 102" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- WEAK! tag -->
  <g transform="rotate(-12 16 116)">
    <rect x="-2" y="106" width="42" height="18" fill="#c8302c" stroke="#000" stroke-width="3"/>
    <text x="19" y="119" text-anchor="middle" font-family="Impact, sans-serif" font-size="12" fill="#fff">WEAK!</text>
  </g>
</svg>
