<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SMOKE BEAST — billowing smoke creature with glowing ember core eyes -->
  <defs>
    <radialGradient id="sb-smoke" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#3a3a3a" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#1a1a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="sb-ember" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#ffaa20"/>
      <stop offset="0.5" stop-color="#ff4400"/>
      <stop offset="1" stop-color="#3d0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="38" ry="5" fill="#000" opacity="0.7"/>
  <!-- TRAILING SMOKE CLOUDS rising up from creature -->
  <ellipse cx="20" cy="14" rx="14" ry="8" fill="url(#sb-smoke)" opacity="0.6"/>
  <ellipse cx="40" cy="6" rx="12" ry="6" fill="url(#sb-smoke)" opacity="0.5"/>
  <ellipse cx="64" cy="2" rx="16" ry="8" fill="url(#sb-smoke)" opacity="0.6"/>
  <ellipse cx="88" cy="6" rx="12" ry="6" fill="url(#sb-smoke)" opacity="0.5"/>
  <ellipse cx="108" cy="14" rx="14" ry="8" fill="url(#sb-smoke)" opacity="0.6"/>
  <!-- MAIN BODY: rolling/billowing smoke creature -->
  <path d="M 18 70 Q 12 50 28 38 Q 22 26 42 22 Q 50 12 64 18 Q 78 12 86 22 Q 106 26 100 38 Q 116 50 110 70 Q 116 90 100 100 Q 88 114 70 110 Q 56 116 42 110 Q 26 110 18 96 Q 8 88 18 70 Z" fill="url(#sb-smoke)"/>
  <!-- secondary smoke layer for depth -->
  <path d="M 26 80 Q 22 64 36 56 Q 32 46 48 42 Q 56 34 64 38 Q 72 34 80 42 Q 96 46 92 56 Q 106 64 102 80 Q 106 96 92 102 Q 80 110 64 108 Q 48 110 36 102 Q 22 96 26 80 Z" fill="#0a0a0a" opacity="0.6"/>
  <!-- ink edge outline (wispy) -->
  <path d="M 18 70 Q 12 50 28 38 Q 22 26 42 22 Q 50 12 64 18 Q 78 12 86 22 Q 106 26 100 38 Q 116 50 110 70 Q 116 90 100 100 Q 88 114 70 110 Q 56 116 42 110 Q 26 110 18 96 Q 8 88 18 70 Z" fill="none" stroke="#1a1108" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- GLOWING EMBER EYES (the centerpiece) -->
  <circle cx="46" cy="62" r="14" fill="url(#sb-ember)"/>
  <circle cx="82" cy="62" r="14" fill="url(#sb-ember)"/>
  <!-- ember core -->
  <circle cx="46" cy="62" r="6" fill="#ffaa20"/>
  <circle cx="82" cy="62" r="6" fill="#ffaa20"/>
  <circle cx="46" cy="62" r="3" fill="#ffeebb"/>
  <circle cx="82" cy="62" r="3" fill="#ffeebb"/>
  <!-- glowing pupil -->
  <circle cx="46" cy="62" r="1.2" fill="#fff"/>
  <circle cx="82" cy="62" r="1.2" fill="#fff"/>
  <!-- glowing maw with embers -->
  <path d="M 38 86 Q 64 102 90 86 Q 64 94 38 86 Z" fill="#ff4400"/>
  <path d="M 38 86 Q 64 102 90 86" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- ember teeth -->
  <path d="M 44 90 L 42 98 M 52 92 L 52 102 M 62 92 L 62 104 M 72 92 L 72 102 M 82 90 L 84 98" stroke="#ffaa20" stroke-width="2" stroke-linecap="round"/>
  <!-- ash flakes drifting around -->
  <circle cx="6" cy="30" r="1.5" fill="#888" opacity="0.7"/>
  <circle cx="118" cy="34" r="1.2" fill="#888" opacity="0.7"/>
  <circle cx="14" cy="60" r="1" fill="#888" opacity="0.6"/>
  <circle cx="120" cy="64" r="1.4" fill="#888" opacity="0.7"/>
  <circle cx="10" cy="92" r="1.2" fill="#888" opacity="0.6"/>
  <circle cx="120" cy="96" r="1" fill="#888" opacity="0.6"/>
  <!-- glowing ember sparks -->
  <circle cx="22" cy="38" r="1.2" fill="#ffaa20" opacity="0.8"/>
  <circle cx="106" cy="42" r="1" fill="#ff8020" opacity="0.7"/>
  <circle cx="30" cy="100" r="1.4" fill="#ffaa20" opacity="0.7"/>
  <circle cx="100" cy="102" r="1.2" fill="#ff8020" opacity="0.7"/>
</svg>
