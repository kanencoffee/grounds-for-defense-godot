<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BURNT BEAN — charred, smoking, phases -->
  <ellipse cx="32" cy="60" rx="14" ry="2" fill="#1a1108" opacity="0.4"/>
  <!-- smoke wisps rising -->
  <path d="M 18 20 Q 14 12 18 4 Q 22 0 16 -4" fill="none" stroke="#666" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
  <path d="M 32 16 Q 28 8 32 0 Q 36 -4 30 -8" fill="none" stroke="#666" stroke-width="3.5" opacity="0.7" stroke-linecap="round"/>
  <path d="M 46 20 Q 50 12 46 4 Q 42 0 48 -4" fill="none" stroke="#666" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
  <!-- bean body — black/charred -->
  <ellipse cx="32" cy="38" rx="22" ry="22" fill="#1a1108" stroke="#3d2817" stroke-width="2"/>
  <!-- charcoal cracks glowing red -->
  <path d="M 14 32 Q 22 36 18 44" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.85"/>
  <path d="M 50 30 Q 44 38 48 46" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.85"/>
  <path d="M 24 24 L 28 30" stroke="#d97706" stroke-width="1" opacity="0.7"/>
  <path d="M 38 24 L 36 30" stroke="#d97706" stroke-width="1" opacity="0.7"/>
  <!-- center crease -->
  <path d="M 32 18 Q 26 38 32 58" fill="none" stroke="#3d2817" stroke-width="2.5"/>
  <!-- glowing-ember crease -->
  <path d="M 32 22 Q 28 38 32 54" fill="none" stroke="#ff4422" stroke-width="0.8" opacity="0.6"/>
  <!-- evil glowing eyes -->
  <ellipse cx="22" cy="38" rx="2.5" ry="2" fill="#ff4422"/>
  <ellipse cx="42" cy="38" rx="2.5" ry="2" fill="#ff4422"/>
  <circle cx="22" cy="38" r="1" fill="#ffaa44"/>
  <circle cx="42" cy="38" r="1" fill="#ffaa44"/>
  <!-- evil grin showing red glow inside -->
  <path d="M 22 48 Q 32 56 42 48 Q 32 50 22 48 Z" fill="#ff4422"/>
  <path d="M 22 48 Q 32 56 42 48" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- ash flakes -->
  <circle cx="8" cy="30" r="1" fill="#444" opacity="0.6"/>
  <circle cx="56" cy="34" r="0.8" fill="#444" opacity="0.5"/>
  <circle cx="6" cy="46" r="0.7" fill="#444" opacity="0.5"/>
</svg>
