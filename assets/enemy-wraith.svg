<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- BURNY McBURNFACE — black charred bean with glowing orange ember cracks, smoke clouds -->
  <ellipse cx="64" cy="120" rx="40" ry="4" fill="#000" opacity="0.7"/>
  <!-- thick smoke clouds rising -->
  <ellipse cx="22" cy="14" rx="10" ry="6" fill="#666" stroke="#000" stroke-width="3"/>
  <ellipse cx="32" cy="6" rx="8" ry="4" fill="#888" stroke="#000" stroke-width="3"/>
  <ellipse cx="64" cy="10" rx="14" ry="7" fill="#666" stroke="#000" stroke-width="3"/>
  <ellipse cx="74" cy="0" rx="10" ry="5" fill="#888" stroke="#000" stroke-width="3"/>
  <ellipse cx="106" cy="14" rx="10" ry="6" fill="#666" stroke="#000" stroke-width="3"/>
  <ellipse cx="96" cy="6" rx="8" ry="4" fill="#888" stroke="#000" stroke-width="3"/>
  <!-- bean body — pure black charcoal -->
  <ellipse cx="64" cy="68" rx="44" ry="46" fill="#000" stroke="#000" stroke-width="5"/>
  <!-- glowing orange ember cracks -->
  <path d="M 22 56 Q 38 64 32 80" stroke="#ff6020" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 106 52 Q 90 66 96 84" stroke="#ff6020" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 36 36 L 46 50" stroke="#ff4400" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 36 L 76 50" stroke="#ff4400" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30 90 L 44 100" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
  <path d="M 98 90 L 84 100" stroke="#ff4400" stroke-width="3" stroke-linecap="round"/>
  <!-- inner ember layer (yellow core) -->
  <path d="M 28 60 Q 36 66 32 76" stroke="#ffaa00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 56 Q 92 66 96 78" stroke="#ffaa00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- center crease — thick -->
  <path d="M 64 24 Q 56 68 64 112" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <!-- ember down the crease -->
  <path d="M 64 36 Q 60 68 64 100" fill="none" stroke="#ff4400" stroke-width="2"/>
  <!-- evil glowing eyes — pure orange/yellow -->
  <ellipse cx="44" cy="68" rx="9" ry="7" fill="#ff6020" stroke="#000" stroke-width="4"/>
  <ellipse cx="84" cy="68" rx="9" ry="7" fill="#ff6020" stroke="#000" stroke-width="4"/>
  <circle cx="44" cy="68" r="3.5" fill="#ffd24a"/>
  <circle cx="84" cy="68" r="3.5" fill="#ffd24a"/>
  <!-- evil grin showing red glow inside -->
  <path d="M 38 90 Q 64 106 90 90 Q 64 96 38 90 Z" fill="#ff4400" stroke="#000" stroke-width="3"/>
  <path d="M 42 92 L 44 98 M 50 94 L 50 100 M 58 95 L 58 102 M 64 96 L 64 104 M 70 95 L 70 102 M 78 94 L 78 100 M 86 92 L 84 98" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <!-- BURNT! tag -->
  <g transform="rotate(-10 16 110)">
    <rect x="-2" y="100" width="42" height="16" fill="#000" stroke="#ff6020" stroke-width="3"/>
    <text x="19" y="111" text-anchor="middle" font-family="Impact, sans-serif" font-size="11" fill="#ff6020">BURNT!</text>
  </g>
</svg>
