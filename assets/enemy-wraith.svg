<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- BURNT BEAN / OVER-ROASTED: held past 240°C internal; sugars carbonize, origin flavor lost, only ash + bitterness remain. -->
  <ellipse cx="64" cy="120" rx="40" ry="4" fill="#1a1108" opacity="0.5"/>
  <!-- thick smoke wisps (lots, this thing's burning) -->
  <path d="M 28 32 Q 22 16 28 4 Q 34 -4 24 -10" fill="none" stroke="#666" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
  <path d="M 64 24 Q 56 8 64 -4 Q 72 -12 60 -20" fill="none" stroke="#666" stroke-width="6" opacity="0.75" stroke-linecap="round"/>
  <path d="M 100 32 Q 106 16 100 4 Q 94 -4 104 -10" fill="none" stroke="#666" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
  <!-- bean body — pure black/charcoal -->
  <ellipse cx="64" cy="68" rx="44" ry="46" fill="#0a0604" stroke="#3d2817" stroke-width="3"/>
  <!-- glowing red-orange cracks (charcoal/ember effect) -->
  <path d="M 24 56 Q 38 64 30 78" stroke="#d97706" stroke-width="3" fill="none"/>
  <path d="M 100 52 Q 88 66 96 84" stroke="#d97706" stroke-width="3" fill="none"/>
  <path d="M 40 38 L 48 50" stroke="#ff4422" stroke-width="2"/>
  <path d="M 80 38 L 76 50" stroke="#ff4422" stroke-width="2"/>
  <path d="M 32 88 L 42 100" stroke="#ff4422" stroke-width="1.5"/>
  <path d="M 96 92 L 86 102" stroke="#ff4422" stroke-width="1.5"/>
  <!-- center crease -->
  <path d="M 64 30 Q 54 68 64 106" fill="none" stroke="#3d2817" stroke-width="5"/>
  <!-- ember crease glow -->
  <path d="M 64 36 Q 58 68 64 100" fill="none" stroke="#ff4422" stroke-width="1.2" opacity="0.7"/>
  <!-- glowing evil eyes -->
  <ellipse cx="44" cy="68" rx="5" ry="4" fill="#ff4422"/>
  <ellipse cx="84" cy="68" rx="5" ry="4" fill="#ff4422"/>
  <circle cx="44" cy="68" r="2" fill="#ffaa44"/>
  <circle cx="84" cy="68" r="2" fill="#ffaa44"/>
  <!-- eye glow halo -->
  <circle cx="44" cy="68" r="8" fill="#ff4422" opacity="0.25"/>
  <circle cx="84" cy="68" r="8" fill="#ff4422" opacity="0.25"/>
  <!-- evil grin showing red glow inside -->
  <path d="M 42 86 Q 64 100 86 86 Q 64 92 42 86 Z" fill="#ff4422"/>
  <path d="M 42 86 Q 64 100 86 86" fill="none" stroke="#1a1108" stroke-width="3" stroke-linecap="round"/>
  <!-- temperature thermometer label -->
  <rect x="34" y="42" width="60" height="14" fill="#fff8f0" stroke="#1a1108" stroke-width="1.5" rx="1"/>
  <text x="64" y="52" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#c8302c">240°C INTERNAL!</text>
  <!-- defect tag -->
  <g transform="rotate(-12 14 100)">
    <rect x="2" y="94" width="32" height="13" fill="#1a1108" stroke="#ff4422" stroke-width="1"/>
    <text x="18" y="104" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ff4422">CARBONIZED</text>
  </g>
  <!-- ash cloud -->
  <circle cx="14" cy="38" r="1.5" fill="#666" opacity="0.6"/>
  <circle cx="116" cy="44" r="1.2" fill="#666" opacity="0.6"/>
  <circle cx="10" cy="60" r="1" fill="#666" opacity="0.5"/>
  <circle cx="118" cy="68" r="1.3" fill="#666" opacity="0.5"/>
  <!-- "lost origin flavor" -->
  <text x="98" y="118" text-anchor="end" font-family="sans-serif" font-size="6" font-weight="bold" fill="#3d2817">ORIGIN:</text>
  <text x="124" y="118" text-anchor="end" font-family="sans-serif" font-size="6" font-weight="bold" fill="#c8302c">LOST</text>
  <text x="64" y="124" text-anchor="middle" font-family="monospace" font-size="6" font-weight="bold" fill="#1a1108" opacity="0.8">+200% BITTER</text>
</svg>
