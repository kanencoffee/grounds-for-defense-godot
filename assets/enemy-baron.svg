<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- K-CUP KAIJU (BOSS) — Godzilla-style monster pod: scaly armor, claws, roaring foil mouth, spike crest -->
  <defs>
    <radialGradient id="kk-shell" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.6" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="kk-belly" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#e85c2c"/>
      <stop offset="1" stop-color="#8b1c1c" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="kk-foil" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#ffeebb"/>
      <stop offset="1" stop-color="#c8a020" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="190" rx="60" ry="6" fill="#000" opacity="0.6"/>
  <!-- DORSAL SPIKES on top (Godzilla crest) -->
  <path d="M 50 24 L 58 4 L 64 22 L 72 0 L 80 22 L 88 0 L 96 22 L 104 4 L 112 24" fill="#0a0a0a" stroke="#1a1108" stroke-width="2.5"/>
  <!-- skull head (top) -->
  <path d="M 36 36 Q 30 18 50 14 Q 80 8 110 14 Q 130 18 124 36 L 124 50 L 36 50 Z" fill="url(#kk-shell)" stroke="#1a1108" stroke-width="3"/>
  <!-- foil top (smaller, more menacing) -->
  <ellipse cx="80" cy="50" rx="44" ry="5" fill="url(#kk-foil)" stroke="#1a1108" stroke-width="3"/>
  <ellipse cx="80" cy="48" rx="36" ry="2.5" fill="#fff8c8"/>
  <!-- "K-CUP KAIJU" texture lines on foil -->
  <line x1="50" y1="48" x2="60" y2="48" stroke="#7a5018" stroke-width="0.8"/>
  <line x1="68" y1="48" x2="78" y2="48" stroke="#7a5018" stroke-width="0.8"/>
  <line x1="86" y1="48" x2="96" y2="48" stroke="#7a5018" stroke-width="0.8"/>
  <line x1="104" y1="48" x2="114" y2="48" stroke="#7a5018" stroke-width="0.8"/>
  <!-- BODY: tapered like a pod but with scales and ridges -->
  <path d="M 30 50 L 42 184 Q 42 192 50 192 L 110 192 Q 118 192 118 184 L 130 50 Z" fill="url(#kk-shell)" stroke="#1a1108" stroke-width="3"/>
  <!-- BELLY (orange-red exposed underbelly) -->
  <path d="M 48 80 Q 52 130 56 184 Q 60 188 80 188 Q 100 188 104 184 Q 108 130 112 80 Q 80 76 48 80 Z" fill="url(#kk-belly)" stroke="#1a1108" stroke-width="2"/>
  <!-- belly horizontal scale ridges -->
  <line x1="50" y1="100" x2="110" y2="100" stroke="#5c1010" stroke-width="1.5" opacity="0.7"/>
  <line x1="51" y1="120" x2="109" y2="120" stroke="#5c1010" stroke-width="1.5" opacity="0.7"/>
  <line x1="52" y1="140" x2="108" y2="140" stroke="#5c1010" stroke-width="1.5" opacity="0.7"/>
  <line x1="53" y1="160" x2="107" y2="160" stroke="#5c1010" stroke-width="1.5" opacity="0.7"/>
  <!-- SCALY shell texture (overlapping scales on dark sides) -->
  <g fill="#0a0a0a" stroke="#444" stroke-width="0.8">
    <path d="M 30 60 Q 36 64 42 60 Q 36 56 30 60 Z"/>
    <path d="M 32 80 Q 38 84 44 80 Q 38 76 32 80 Z"/>
    <path d="M 34 100 Q 40 104 46 100 Q 40 96 34 100 Z"/>
    <path d="M 36 130 Q 42 134 48 130 Q 42 126 36 130 Z"/>
    <path d="M 38 160 Q 44 164 50 160 Q 44 156 38 160 Z"/>
    <path d="M 130 60 Q 124 64 118 60 Q 124 56 130 60 Z"/>
    <path d="M 128 80 Q 122 84 116 80 Q 122 76 128 80 Z"/>
    <path d="M 126 100 Q 120 104 114 100 Q 120 96 126 100 Z"/>
    <path d="M 124 130 Q 118 134 112 130 Q 118 126 124 130 Z"/>
    <path d="M 122 160 Q 116 164 110 160 Q 116 156 122 160 Z"/>
  </g>
  <!-- ROARING MOUTH (open foil mouth at center showing teeth) -->
  <ellipse cx="80" cy="116" rx="22" ry="14" fill="#1a1108" stroke="#1a1108" stroke-width="2"/>
  <!-- teeth -->
  <path d="M 62 110 L 64 122 L 68 110 L 70 124 L 74 110 L 76 124 L 80 110 L 82 124 L 86 110 L 88 124 L 92 110 L 94 122 L 98 110" fill="#fff8c8" stroke="#1a1108" stroke-width="1.5"/>
  <!-- tongue -->
  <ellipse cx="80" cy="124" rx="10" ry="3" fill="#c8302c" stroke="#1a1108" stroke-width="1.5"/>
  <!-- GLOWING YELLOW EYES (kaiju style) -->
  <ellipse cx="58" cy="76" rx="9" ry="7" fill="#ffd24a" stroke="#1a1108" stroke-width="3"/>
  <ellipse cx="102" cy="76" rx="9" ry="7" fill="#ffd24a" stroke="#1a1108" stroke-width="3"/>
  <!-- vertical reptile pupils -->
  <ellipse cx="58" cy="76" rx="1.5" ry="5" fill="#1a1108"/>
  <ellipse cx="102" cy="76" rx="1.5" ry="5" fill="#1a1108"/>
  <!-- eye glow -->
  <circle cx="58" cy="76" r="12" fill="#ffd24a" opacity="0.3"/>
  <circle cx="102" cy="76" r="12" fill="#ffd24a" opacity="0.3"/>
  <!-- ANGRY BROW RIDGES -->
  <path d="M 44 64 L 70 70 L 70 74 L 44 70 Z" fill="#0a0a0a" stroke="#1a1108" stroke-width="2"/>
  <path d="M 116 64 L 90 70 L 90 74 L 116 70 Z" fill="#0a0a0a" stroke="#1a1108" stroke-width="2"/>
  <!-- CLAWED ARMS / spike protrusions on sides -->
  <path d="M 26 112 L 6 100 L 14 116 L 0 122 L 18 130 L 8 146 L 26 138 Z" fill="url(#kk-shell)" stroke="#1a1108" stroke-width="2.5"/>
  <path d="M 134 112 L 154 100 L 146 116 L 160 122 L 142 130 L 152 146 L 134 138 Z" fill="url(#kk-shell)" stroke="#1a1108" stroke-width="2.5"/>
  <!-- claw tips -->
  <path d="M 0 122 L -4 124 L -2 120 Z M 6 100 L 2 102 L 4 98 Z" fill="#fff8c8" stroke="#1a1108" stroke-width="1.5"/>
  <path d="M 160 122 L 164 124 L 162 120 Z M 154 100 L 158 102 L 156 98 Z" fill="#fff8c8" stroke="#1a1108" stroke-width="1.5"/>
  <!-- nostrils on snout (smoke wisps coming out) -->
  <ellipse cx="74" cy="86" rx="1.5" ry="2" fill="#000"/>
  <ellipse cx="86" cy="86" rx="1.5" ry="2" fill="#000"/>
  <path d="M 74 86 Q 70 78 74 70" stroke="#888" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 86 86 Q 90 78 86 70" stroke="#888" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
