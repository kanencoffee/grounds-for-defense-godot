<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- POD-ZILLA (BOSS) — comic book villain: bright orange pod, gold crown, purple cape -->
  <defs>
    <pattern id="ht-pod" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1" fill="#000" opacity="0.4"/>
    </pattern>
  </defs>
  <ellipse cx="80" cy="190" rx="60" ry="6" fill="#000" opacity="0.7"/>
  <!-- royal cape (purple, behind everything) -->
  <path d="M 18 60 L 8 150 L 22 158 L 44 60 Z" fill="#5a1a4a" stroke="#000" stroke-width="5"/>
  <path d="M 142 60 L 152 150 L 138 158 L 116 60 Z" fill="#5a1a4a" stroke="#000" stroke-width="5"/>
  <!-- cape highlights -->
  <path d="M 14 80 L 18 140" stroke="#7a3a6a" stroke-width="3" fill="none"/>
  <path d="M 146 80 L 142 140" stroke="#7a3a6a" stroke-width="3" fill="none"/>
  <!-- gold crown -->
  <path d="M 36 26 L 42 4 L 56 22 L 80 0 L 104 22 L 118 4 L 124 26 L 124 36 L 36 36 Z" fill="#ffd24a" stroke="#000" stroke-width="5"/>
  <!-- crown jewels -->
  <circle cx="80" cy="14" r="5" fill="#c8302c" stroke="#000" stroke-width="3"/>
  <circle cx="56" cy="20" r="3.5" fill="#88bbee" stroke="#000" stroke-width="2.5"/>
  <circle cx="104" cy="20" r="3.5" fill="#88bbee" stroke="#000" stroke-width="2.5"/>
  <rect x="36" y="28" width="88" height="8" fill="#c8a030" stroke="#000" stroke-width="3"/>
  <!-- foil top -->
  <ellipse cx="80" cy="44" rx="44" ry="7" fill="#e8e8e8" stroke="#000" stroke-width="5"/>
  <ellipse cx="80" cy="42" rx="36" ry="3" fill="#fff"/>
  <ellipse cx="62" cy="40" rx="14" ry="2" fill="#fff"/>
  <!-- pod body — bright orange plastic -->
  <path d="M 30 44 L 38 184 Q 38 192 46 192 L 114 192 Q 122 192 122 184 L 130 44 Z" fill="#ff6633" stroke="#000" stroke-width="5"/>
  <!-- shadow side (halftone) -->
  <path d="M 130 44 L 122 184 Q 122 192 114 192 L 96 192 L 96 44 Z" fill="url(#ht-pod)"/>
  <!-- highlight stripe -->
  <rect x="44" y="48" width="8" height="138" fill="#fff" opacity="0.65"/>
  <!-- ridges -->
  <line x1="38" y1="76" x2="124" y2="76" stroke="#000" stroke-width="2"/>
  <line x1="38" y1="100" x2="124" y2="100" stroke="#000" stroke-width="2"/>
  <line x1="38" y1="148" x2="124" y2="148" stroke="#000" stroke-width="2"/>
  <line x1="38" y1="170" x2="124" y2="170" stroke="#000" stroke-width="2"/>
  <!-- white center label -->
  <ellipse cx="80" cy="116" rx="36" ry="28" fill="#fff" stroke="#000" stroke-width="5"/>
  <text x="80" y="108" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="20" font-weight="900" fill="#000">K-POD</text>
  <text x="80" y="128" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" font-style="italic" fill="#c8302c">TYRANT</text>
  <!-- big evil eyes (above label) -->
  <ellipse cx="56" cy="68" rx="8" ry="9" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="104" cy="68" rx="8" ry="9" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="56" cy="70" r="4" fill="#000"/>
  <circle cx="104" cy="70" r="4" fill="#000"/>
  <circle cx="58" cy="68" r="1.5" fill="#fff"/>
  <circle cx="106" cy="68" r="1.5" fill="#fff"/>
  <!-- evil eyebrows -->
  <path d="M 42 56 Q 50 60 66 62 L 68 66 L 64 62 Q 50 56 42 58 Z" fill="#000"/>
  <path d="M 96 62 Q 110 56 118 58 Q 110 60 96 66 L 94 64 Z" fill="#000"/>
  <!-- evil smirk -->
  <path d="M 50 158 Q 80 174 110 158 Q 80 162 50 158 Z" fill="#000"/>
  <path d="M 56 162 L 60 168 M 66 164 L 70 170 M 76 166 L 80 172 M 86 166 L 90 170 M 96 164 L 100 168" stroke="#fff" stroke-width="1.5"/>
  <!-- BOSS! burst -->
  <g transform="translate(20 -8)">
    <polygon points="0,16 8,4 18,10 28,2 36,16 44,4 52,16 48,24 56,28 42,32 50,40 36,36 28,46 20,36 8,40 12,28 -2,24" fill="#ffd24a" stroke="#000" stroke-width="4"/>
    <text x="26" y="28" text-anchor="middle" font-family="Impact, sans-serif" font-size="13" font-weight="900" fill="#000">BOSS!</text>
  </g>
</svg>
