<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- POD TYRANT — boss: giant K-cup pod with crown, the king of bad coffee -->
  <ellipse cx="40" cy="74" rx="26" ry="3" fill="#1a1108" opacity="0.5"/>
  <!-- gold crown -->
  <path d="M 22 14 L 26 4 L 32 12 L 40 2 L 48 12 L 54 4 L 58 14 L 58 18 L 22 18 Z" fill="#f0c987" stroke="#8b5a2b" stroke-width="2"/>
  <circle cx="40" cy="6" r="2.5" fill="#c8302c" stroke="#8b5a2b" stroke-width="1"/>
  <circle cx="26" cy="8" r="1.5" fill="#88bbee" stroke="#8b5a2b" stroke-width="0.8"/>
  <circle cx="54" cy="8" r="1.5" fill="#88bbee" stroke="#8b5a2b" stroke-width="0.8"/>
  <rect x="22" y="14" width="36" height="4" fill="#d4a574" stroke="#8b5a2b" stroke-width="1.5"/>
  <!-- foil top of pod -->
  <ellipse cx="40" cy="22" rx="22" ry="4" fill="#e8e8e8" stroke="#1a1108" stroke-width="2"/>
  <ellipse cx="40" cy="21" rx="18" ry="2" fill="#fff" opacity="0.8"/>
  <!-- foil shine -->
  <ellipse cx="32" cy="20" rx="6" ry="1" fill="#fff"/>
  <!-- pod body — bright orange/red plastic -->
  <path d="M 18 22 L 22 70 Q 22 74 26 74 L 54 74 Q 58 74 58 70 L 62 22 Z" fill="#e85a3a" stroke="#1a1108" stroke-width="2.5"/>
  <!-- ridges on pod -->
  <line x1="20" y1="34" x2="60" y2="34" stroke="#1a1108" stroke-width="0.8" opacity="0.4"/>
  <line x1="21" y1="44" x2="59" y2="44" stroke="#1a1108" stroke-width="0.8" opacity="0.4"/>
  <line x1="22" y1="56" x2="58" y2="56" stroke="#1a1108" stroke-width="0.8" opacity="0.4"/>
  <!-- shine on plastic -->
  <path d="M 22 26 L 24 70" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <!-- center label area — white with text -->
  <ellipse cx="40" cy="46" rx="14" ry="10" fill="#fff8f0" stroke="#1a1108" stroke-width="1.5"/>
  <text x="40" y="44" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#1a1108">K-POD</text>
  <text x="40" y="52" text-anchor="middle" font-family="serif" font-size="4" fill="#c8302c">TYRANT</text>
  <!-- evil eyes (above label) -->
  <circle cx="30" cy="34" r="2.5" fill="#fff"/>
  <circle cx="50" cy="34" r="2.5" fill="#fff"/>
  <circle cx="30" cy="34" r="1.3" fill="#1a1108"/>
  <circle cx="50" cy="34" r="1.3" fill="#1a1108"/>
  <circle cx="30.5" cy="33.5" r="0.5" fill="#fff"/>
  <circle cx="50.5" cy="33.5" r="0.5" fill="#fff"/>
  <!-- angry eyebrows -->
  <path d="M 26 30 L 34 32" stroke="#1a1108" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 46 32 L 54 30" stroke="#1a1108" stroke-width="2.5" stroke-linecap="round"/>
  <!-- evil smirk below label -->
  <path d="M 30 60 Q 40 66 50 60" fill="#1a1108"/>
  <path d="M 32 62 L 35 64 M 38 63 L 41 65 M 44 63 L 47 64" stroke="#fff" stroke-width="0.8"/>
  <!-- royal cape behind -->
  <path d="M 12 30 L 8 60 L 14 64 L 22 30 Z" fill="#5a1a4a" stroke="#1a1108" stroke-width="1.5" opacity="0.8"/>
  <path d="M 68 30 L 72 60 L 66 64 L 58 30 Z" fill="#5a1a4a" stroke="#1a1108" stroke-width="1.5" opacity="0.8"/>
</svg>
