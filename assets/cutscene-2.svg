<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Panel 2: BUT SOMETHING'S WRONG — shadow falls, dread -->
  <defs>
    <linearGradient id="dread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87060"/>
      <stop offset="0.6" stop-color="#5c3a4c"/>
      <stop offset="1" stop-color="#1a1108"/>
    </linearGradient>
    <pattern id="ht-c2" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#000" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dread)" stroke="#000" stroke-width="10"/>
  <!-- ominous shadow swooping in from top -->
  <path d="M 0 0 L 800 0 L 800 200 Q 600 280 400 220 Q 200 280 0 200 Z" fill="#000" opacity="0.7"/>
  <path d="M 0 0 L 800 0 L 800 200 Q 600 280 400 220 Q 200 280 0 200 Z" fill="url(#ht-c2)"/>
  <!-- coffee cup smaller, displaced -->
  <g transform="translate(310 240)">
    <path d="M 30 60 L 38 180 Q 38 196 56 196 L 124 196 Q 142 196 142 180 L 150 60 Z" fill="#fff" stroke="#000" stroke-width="6"/>
    <ellipse cx="90" cy="60" rx="62" ry="10" fill="#3d2817" stroke="#000" stroke-width="5"/>
    <ellipse cx="90" cy="58" rx="48" ry="5" fill="#5c3a1c"/>
    <path d="M 150 96 Q 180 100 180 130 Q 180 160 150 160" fill="none" stroke="#000" stroke-width="6"/>
  </g>
  <!-- distorted steam -->
  <path d="M 380 230 Q 360 200 386 170" stroke="#888" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 420 230 Q 440 195 410 165" stroke="#888" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- ! exclamation marks floating -->
  <text x="200" y="180" font-family="Impact, sans-serif" font-size="60" font-weight="900" fill="#c8302c" stroke="#000" stroke-width="3" transform="rotate(-15 200 180)">!</text>
  <text x="640" y="180" font-family="Impact, sans-serif" font-size="60" font-weight="900" fill="#c8302c" stroke="#000" stroke-width="3" transform="rotate(20 640 180)">!</text>
  <text x="540" y="220" font-family="Impact, sans-serif" font-size="40" font-weight="900" fill="#c8302c" stroke="#000" stroke-width="2" transform="rotate(-8 540 220)">?</text>
  <!-- Caption -->
  <rect x="80" y="370" width="640" height="60" fill="#fff8e8" stroke="#000" stroke-width="5"/>
  <text x="400" y="411" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="30" fill="#000">BUT SOMETHING'S WRONG...</text>
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#000" stroke-width="6"/>
</svg>
