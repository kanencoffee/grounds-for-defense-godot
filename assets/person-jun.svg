<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- JUN — sleek modernist; sharp jawline, fitted turtleneck, defined chest -->
  <defs>
    <radialGradient id="j-skin" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#f0d4a8"/>
      <stop offset="1" stop-color="#c8956a" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="j-tn" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#3a5a7a"/>
      <stop offset="1" stop-color="#1a2a4a" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#3d2817" opacity="0.35"/>
  <!-- fitted turtleneck (broader shoulders, tapered waist) -->
  <path d="M 38 122 Q 30 168 32 200 L 28 222 L 164 222 L 160 200 Q 162 168 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="url(#j-tn)"/>
  <path d="M 38 122 Q 30 168 32 200 L 28 222 L 164 222 L 160 200 Q 162 168 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- TURTLENECK collar (signature high neck) -->
  <ellipse cx="96" cy="84" rx="32" ry="7" fill="#1a2a4a" stroke="#3d2817" stroke-width="2"/>
  <ellipse cx="96" cy="80" rx="28" ry="3" fill="#3a5a7a"/>
  <!-- chest pec definition through fitted fabric -->
  <path d="M 96 116 L 96 152" stroke="#0a1a2a" stroke-width="1.8" opacity="0.85"/>
  <path d="M 70 132 Q 86 152 96 152 Q 106 152 122 132" fill="none" stroke="#0a1a2a" stroke-width="1.8" opacity="0.7"/>
  <!-- shoulder line -->
  <path d="M 56 100 Q 70 110 96 116 Q 122 110 136 100" fill="none" stroke="#0a1a2a" stroke-width="1.2" opacity="0.55"/>
  <!-- waist tapered -->
  <path d="M 50 175 Q 96 180 142 175" fill="none" stroke="#0a1a2a" stroke-width="1.2" opacity="0.5"/>
  <!-- defined biceps -->
  <path d="M 32 130 Q 28 152 38 174 Q 52 178 56 156 Q 60 132 56 122 Z" fill="url(#j-tn)" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 160 130 Q 164 152 154 174 Q 140 178 136 156 Q 132 132 136 122 Z" fill="url(#j-tn)" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 36 144 Q 44 152 50 144" fill="none" stroke="#0a1a2a" stroke-width="1.2" opacity="0.6"/>
  <path d="M 156 144 Q 148 152 142 144" fill="none" stroke="#0a1a2a" stroke-width="1.2" opacity="0.6"/>
  <!-- forearms / hands -->
  <ellipse cx="42" cy="190" rx="11" ry="14" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="150" cy="190" rx="11" ry="14" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="46" cy="206" r="11" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="146" cy="208" r="11" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff8e8" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#5c3a1c" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#3d2817"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- chiseled angular jaw + cheekbones -->
  <path d="M 60 56 Q 56 24 80 20 Q 96 18 112 20 Q 136 24 132 56 Q 132 70 124 78 Q 116 90 96 92 Q 76 90 68 78 Q 60 70 60 56 Z" fill="url(#j-skin)" stroke="#3d2817" stroke-width="2"/>
  <ellipse cx="60" cy="60" rx="4" ry="7" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="132" cy="60" rx="4" ry="7" fill="url(#j-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- sharp cheekbones (visible contour) -->
  <path d="M 66 64 Q 74 72 78 80" stroke="#a87852" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 126 64 Q 118 72 114 80" stroke="#a87852" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- jawline shadow -->
  <path d="M 76 88 Q 96 92 116 88" stroke="#7a4830" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- SLEEK undercut hairstyle: long swept top, very short sides -->
  <!-- top wave -->
  <path d="M 70 38 Q 64 12 96 8 Q 130 12 124 38 L 130 50 Q 124 22 110 18 Q 96 16 82 18 Q 68 22 64 50 L 70 38 Z" fill="#0a0808" stroke="#3d2817" stroke-width="2"/>
  <!-- styled sweep top (volume, motion) -->
  <path d="M 78 14 Q 96 0 122 10 Q 116 18 96 18 Q 80 18 78 14 Z" fill="#0a0808" stroke="#3d2817" stroke-width="1.8"/>
  <!-- shaved sides (thin lines indicate buzzed) -->
  <line x1="62" y1="44" x2="64" y2="58" stroke="#3d2817" stroke-width="0.6" opacity="0.7"/>
  <line x1="65" y1="44" x2="67" y2="58" stroke="#3d2817" stroke-width="0.6" opacity="0.5"/>
  <line x1="130" y1="44" x2="128" y2="58" stroke="#3d2817" stroke-width="0.6" opacity="0.7"/>
  <line x1="127" y1="44" x2="125" y2="58" stroke="#3d2817" stroke-width="0.6" opacity="0.5"/>
  <!-- WIRE-FRAME GLASSES (minimalist) -->
  <rect x="68" y="52" width="22" height="14" fill="#fff" fill-opacity="0.05" stroke="#3d2817" stroke-width="1.8"/>
  <rect x="102" y="52" width="22" height="14" fill="#fff" fill-opacity="0.05" stroke="#3d2817" stroke-width="1.8"/>
  <line x1="90" y1="59" x2="102" y2="59" stroke="#3d2817" stroke-width="1.8"/>
  <!-- piercing intense eyes -->
  <ellipse cx="79" cy="59" rx="2.5" ry="3" fill="#1a1108"/>
  <ellipse cx="113" cy="59" rx="2.5" ry="3" fill="#1a1108"/>
  <circle cx="80" cy="58" r="0.8" fill="#fff"/>
  <circle cx="114" cy="58" r="0.8" fill="#fff"/>
  <!-- subtle eyelashes -->
  <path d="M 74 56 L 72 53 M 86 56 L 88 53 M 106 56 L 104 53 M 118 56 L 120 53" stroke="#1a1108" stroke-width="1.2" stroke-linecap="round"/>
  <!-- sharp confident eyebrows -->
  <path d="M 68 46 Q 80 42 90 46" stroke="#0a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 102 46 Q 112 42 124 46" stroke="#0a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- well-defined nose -->
  <path d="M 96 68 Q 91 80 96 84 Q 101 80 96 68 Z" fill="#c89878" stroke="#3d2817" stroke-width="1.2"/>
  <path d="M 92 78 Q 96 82 100 78" stroke="#a87852" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- defined LIPS — slight smirk -->
  <path d="M 84 86 Q 96 90 108 86" fill="#9a4848" stroke="#3d2817" stroke-width="1.5"/>
  <path d="M 86 86 Q 96 84 106 86" stroke="#5c2818" stroke-width="0.8" fill="none"/>
  <!-- smirk lift -->
  <path d="M 106 86 L 110 82" stroke="#3d2817" stroke-width="1.2" stroke-linecap="round"/>
  <!-- subtle stubble shading (5 o'clock shadow) -->
  <ellipse cx="96" cy="92" rx="20" ry="3" fill="#1a1108" opacity="0.15"/>
  <!-- slight cheek tone -->
  <ellipse cx="74" cy="74" rx="5" ry="3" fill="#a83040" opacity="0.25"/>
  <ellipse cx="118" cy="74" rx="5" ry="3" fill="#a83040" opacity="0.25"/>
</svg>
