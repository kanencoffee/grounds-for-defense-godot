<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- FATHER TIME — calendar with HUGE diagonal "EXPIRED" stamp -->
  <!-- shadow under -->
  <ellipse cx="48" cy="92" rx="34" ry="3" fill="#000" opacity="0.5"/>
  <!-- calendar back panel -->
  <rect x="10" y="18" width="64" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="5"/>
  <!-- header bar (red) -->
  <rect x="10" y="18" width="64" height="16" fill="#c8302c" stroke="#000" stroke-width="5"/>
  <!-- binding rings -->
  <rect x="20" y="10" width="4" height="16" fill="#888" stroke="#000" stroke-width="2.5"/>
  <rect x="60" y="10" width="4" height="16" fill="#888" stroke="#000" stroke-width="2.5"/>
  <!-- "BEST BY" header text -->
  <text x="42" y="31" text-anchor="middle" font-family="Impact, sans-serif" font-size="11" font-weight="bold" fill="#fff">BEST BY</text>
  <!-- BIG year (faded since expired) -->
  <text x="42" y="62" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="26" font-weight="900" fill="#888">2024</text>
  <!-- HUGE diagonal "EXPIRED" stamp -->
  <g transform="rotate(-22 42 56)">
    <rect x="0" y="42" width="84" height="22" fill="none" stroke="#c8302c" stroke-width="5"/>
    <text x="42" y="58" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#c8302c">EXPIRED</text>
  </g>
  <!-- magnifier on top right -->
  <circle cx="78" cy="22" r="11" fill="#fff" stroke="#5c3a1c" stroke-width="4" opacity="0.95"/>
  <circle cx="78" cy="22" r="9" fill="none" stroke="#5c3a1c" stroke-width="2"/>
  <line x1="86" y1="30" x2="92" y2="36" stroke="#5c3a1c" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="30" x2="92" y2="36" stroke="#000" stroke-width="2"/>
</svg>
