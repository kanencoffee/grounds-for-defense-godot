<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- THE DATE READER (reading age): checks roast date / expiration → "freezes" stale items in inspection -->
  <!-- calendar back -->
  <rect x="12" y="20" width="60" height="60" rx="4" fill="#fff" stroke="#1a1108" stroke-width="3"/>
  <!-- header bar -->
  <rect x="12" y="20" width="60" height="14" fill="#c8302c" stroke="#1a1108" stroke-width="3"/>
  <!-- binding rings -->
  <rect x="22" y="14" width="3" height="14" fill="#888" stroke="#1a1108" stroke-width="1.5"/>
  <rect x="58" y="14" width="3" height="14" fill="#888" stroke="#1a1108" stroke-width="1.5"/>
  <!-- "BEST BY" header -->
  <text x="42" y="31" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fff">BEST BY</text>
  <!-- big date -->
  <text x="42" y="56" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1a1108">2024</text>
  <!-- "EXPIRED" diagonal stamp -->
  <g transform="rotate(-20 42 70)">
    <rect x="14" y="62" width="56" height="14" fill="none" stroke="#c8302c" stroke-width="3"/>
    <text x="42" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8302c">EXPIRED</text>
  </g>
  <!-- magnifying lens overlay (small, top right) -->
  <circle cx="74" cy="20" r="10" fill="#fff" stroke="#5c3a1c" stroke-width="2" opacity="0.9"/>
  <line x1="80" y1="26" x2="86" y2="32" stroke="#5c3a1c" stroke-width="3" stroke-linecap="round"/>
</svg>
