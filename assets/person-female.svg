<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- FEMALE — friendly, warm, comic style — purple shirt, shoulder hair, earrings -->
  <defs>
    <pattern id="ht-female" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.0" fill="#000" opacity="0.25"/>
    </pattern>
  </defs>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#000" opacity="0.5"/>
  <!-- T-shirt — warm purple/plum -->
  <path d="M 44 116 L 32 222 L 160 222 L 148 116 Q 148 100 134 94 L 130 100 L 96 116 L 62 100 L 58 94 Q 44 100 44 116 Z" fill="#9a5aaa" stroke="#000" stroke-width="4"/>
  <path d="M 96 116 L 148 116 Q 148 100 134 94 L 130 100 L 100 116 L 100 222 L 160 222 L 148 116 L 100 116 Z" fill="url(#ht-female)"/>
  <path d="M 76 96 L 96 116 L 116 96" fill="none" stroke="#000" stroke-width="3"/>
  <!-- subtle bust contour line (anatomical shape on shirt) -->
  <path d="M 68 134 Q 84 148 96 144 Q 108 148 124 134" fill="none" stroke="#5a2a6a" stroke-width="2" opacity="0.55"/>
  <!-- soft inner curve hinting at waist -->
  <path d="M 64 168 Q 96 174 128 168" fill="none" stroke="#5a2a6a" stroke-width="1.5" opacity="0.4"/>
  <!-- hair flowing onto shoulders (back) -->
  <path d="M 50 96 Q 38 130 50 168 L 80 116 Z" fill="#6a3a18" stroke="#000" stroke-width="4"/>
  <path d="M 142 96 Q 154 130 142 168 L 112 116 Z" fill="#6a3a18" stroke="#000" stroke-width="4"/>
  <!-- arms holding mug -->
  <ellipse cx="46" cy="142" rx="14" ry="32" fill="#9a5aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="50" cy="174" r="13" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="148" cy="146" rx="14" ry="36" fill="#9a5aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="148" cy="184" r="13" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- coffee mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#5c3a1c"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#000" stroke-width="3.5"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="84" y="76" width="24" height="22" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- head -->
  <circle cx="96" cy="56" r="32" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <!-- ears with earrings -->
  <ellipse cx="64" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <ellipse cx="128" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <circle cx="62" cy="62" r="3" fill="#ffd24a" stroke="#000" stroke-width="2"/>
  <circle cx="130" cy="62" r="3" fill="#ffd24a" stroke="#000" stroke-width="2"/>
  <!-- long flowing hair (front + sides) -->
  <path d="M 64 50 Q 56 18 96 12 Q 136 18 128 50 L 132 80 Q 126 88 120 84 Q 116 30 96 26 Q 76 30 72 84 Q 66 88 60 80 L 64 50 Z" fill="#6a3a18" stroke="#000" stroke-width="4"/>
  <!-- side bangs -->
  <path d="M 76 30 Q 80 38 84 50" fill="none" stroke="#3d2817" stroke-width="2"/>
  <path d="M 116 30 Q 112 38 108 50" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- bangs across forehead -->
  <path d="M 70 38 Q 84 32 96 36 Q 108 32 122 38 Q 110 28 96 30 Q 82 28 70 38 Z" fill="#6a3a18" stroke="#000" stroke-width="3"/>
  <!-- friendly arched eyebrows -->
  <path d="M 76 50 Q 84 46 92 50" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 50 Q 108 46 116 50" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- big warm eyes with EYELASHES -->
  <ellipse cx="84" cy="60" rx="6" ry="7" fill="#fff" stroke="#000" stroke-width="3"/>
  <ellipse cx="108" cy="60" rx="6" ry="7" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="84" cy="62" r="3.2" fill="#5c3a1c"/>
  <circle cx="108" cy="62" r="3.2" fill="#5c3a1c"/>
  <circle cx="86" cy="60" r="1.4" fill="#fff"/>
  <circle cx="110" cy="60" r="1.4" fill="#fff"/>
  <!-- prominent eyelashes (top + side) -->
  <path d="M 78 54 L 76 50 M 84 53 L 84 49 M 90 54 L 92 50" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 102 54 L 100 50 M 108 53 L 108 49 M 114 54 L 116 50" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 96 64 Q 93 74 96 78 Q 99 74 96 64 Z" fill="#d8a878" stroke="#000" stroke-width="1.5"/>
  <!-- BIG warm smile with lipstick tone -->
  <path d="M 80 80 Q 96 92 112 80" fill="#e85a78" stroke="#000" stroke-width="3.5"/>
  <path d="M 80 80 L 112 80" stroke="#a82048" stroke-width="1.5"/>
  <!-- pink rosy cheeks -->
  <ellipse cx="74" cy="74" rx="6" ry="4" fill="#e89b7a" opacity="0.7"/>
  <ellipse cx="118" cy="74" rx="6" ry="4" fill="#e89b7a" opacity="0.7"/>
</svg>
