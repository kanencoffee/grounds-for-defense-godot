<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- COFFEE GEEK (idle) — comic book style: bold outlines, flat colors, halftone shading -->
  <defs>
    <pattern id="ht-person" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#000" opacity="0.6"/>
  <!-- T-shirt body — flat blue -->
  <path d="M 44 116 L 32 222 L 160 222 L 148 116 Q 148 100 134 94 L 130 100 L 96 116 L 62 100 L 58 94 Q 44 100 44 116 Z" fill="#5a8aaa" stroke="#000" stroke-width="5"/>
  <!-- shirt shadow side (halftone) -->
  <path d="M 96 116 L 148 116 Q 148 100 134 94 L 130 100 L 100 116 L 100 222 L 160 222 L 148 116 L 100 116 Z" fill="url(#ht-person)"/>
  <!-- collar V -->
  <path d="M 76 96 L 96 116 L 116 96" fill="none" stroke="#000" stroke-width="4"/>
  <!-- left arm holding mug -->
  <ellipse cx="46" cy="142" rx="14" ry="32" fill="#5a8aaa" stroke="#000" stroke-width="4"/>
  <!-- left hand -->
  <circle cx="50" cy="174" r="13" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <!-- right arm relaxed -->
  <ellipse cx="148" cy="146" rx="14" ry="36" fill="#5a8aaa" stroke="#000" stroke-width="4"/>
  <circle cx="148" cy="184" r="13" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <!-- coffee mug (chest level) -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#3d2817" stroke="#000" stroke-width="3"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#5c3a1c"/>
  <!-- handle -->
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#000" stroke-width="4"/>
  <!-- steam -->
  <path d="M 70 152 Q 66 144 72 136" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="84" y="76" width="24" height="22" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <!-- head — flat skin -->
  <circle cx="96" cy="56" r="32" fill="#f5d4a8" stroke="#000" stroke-width="5"/>
  <!-- shadow side of face (halftone) -->
  <path d="M 96 24 Q 128 24 128 56 Q 128 88 96 88 Z" fill="url(#ht-person)"/>
  <!-- ears -->
  <ellipse cx="64" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <ellipse cx="128" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <!-- hair (flat brown, chunky) -->
  <path d="M 64 50 Q 60 18 96 14 Q 132 18 128 50 Q 124 32 110 26 Q 96 24 82 26 Q 68 32 64 50 Z" fill="#5c3a1c" stroke="#000" stroke-width="5"/>
  <!-- bushy eyebrows -->
  <path d="M 76 50 Q 84 48 92 52 L 92 56 L 88 52 Q 80 50 76 52 Z" fill="#000"/>
  <path d="M 100 52 Q 108 48 116 50 L 116 52 L 112 52 Q 104 50 100 56 Z" fill="#000"/>
  <!-- big comic eyes -->
  <ellipse cx="84" cy="60" rx="6" ry="8" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="108" cy="60" rx="6" ry="8" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="84" cy="62" r="3" fill="#000"/>
  <circle cx="108" cy="62" r="3" fill="#000"/>
  <circle cx="86" cy="60" r="1.2" fill="#fff"/>
  <circle cx="110" cy="60" r="1.2" fill="#fff"/>
  <!-- nose -->
  <path d="M 96 64 Q 92 74 96 78 Q 100 74 96 64 Z" fill="#d8a878" stroke="#000" stroke-width="2"/>
  <!-- subtle smile -->
  <path d="M 86 80 Q 96 86 106 80" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="74" cy="70" r="4" fill="#e89b7a" opacity="0.7"/>
  <circle cx="118" cy="70" r="4" fill="#e89b7a" opacity="0.7"/>
</svg>
