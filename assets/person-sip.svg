<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- Person sipping happily — cup raised to mouth, eyes content -->
  <defs>
    <radialGradient id="halo4" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#fff5d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0c987" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8aaa"/>
      <stop offset="1" stop-color="#3a6280"/>
    </linearGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d4a8"/>
      <stop offset="1" stop-color="#d4a574"/>
    </linearGradient>
  </defs>
  <ellipse cx="96" cy="128" rx="120" ry="120" fill="url(#halo4)"/>
  <!-- bigger steam (drinking it) -->
  <path d="M 86 14 Q 80 4 88 -6" stroke="#aaa" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 100 12 Q 94 -2 104 -10" stroke="#aaa" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 116 16 Q 110 4 118 -6" stroke="#aaa" stroke-width="3" fill="none" opacity="0.7"/>
  <ellipse cx="96" cy="220" rx="64" ry="6" fill="#1a1108" opacity="0.45"/>
  <!-- T-shirt body -->
  <path d="M 44 116 L 32 220 L 160 220 L 148 116 Q 148 102 134 96 L 130 100 L 96 116 L 62 100 L 58 96 Q 44 102 44 116 Z" fill="url(#shirt2)" stroke="#1a1108" stroke-width="3"/>
  <path d="M 56 130 L 50 215" stroke="#3a6280" stroke-width="2" opacity="0.5"/>
  <path d="M 136 130 L 142 215" stroke="#1a3850" stroke-width="2" opacity="0.5"/>
  <path d="M 76 96 L 96 116 L 116 96" fill="none" stroke="#1a3850" stroke-width="2.5"/>
  <!-- right arm relaxed -->
  <ellipse cx="148" cy="140" rx="12" ry="32" fill="url(#shirt2)" stroke="#1a1108" stroke-width="2.5"/>
  <circle cx="148" cy="180" r="11" fill="url(#skin4)" stroke="#1a1108" stroke-width="2.5"/>
  <!-- LEFT arm raised up to the face holding the mug -->
  <path d="M 36 116 Q 32 96 56 78 L 76 64 Q 80 60 86 64 L 88 92 Q 88 110 60 142 Z" fill="url(#shirt2)" stroke="#1a1108" stroke-width="2.5"/>
  <!-- left hand behind/below mug -->
  <circle cx="78" cy="60" r="9" fill="url(#skin4)" stroke="#1a1108" stroke-width="2.5"/>
  <!-- coffee mug at face level (covers mouth) -->
  <path d="M 60 36 L 64 78 Q 64 84 70 84 L 110 84 Q 116 84 116 78 L 120 36 Z" fill="#fff8f0" stroke="#1a1108" stroke-width="3"/>
  <ellipse cx="90" cy="36" rx="30" ry="5" fill="#3d2817" stroke="#1a1108" stroke-width="2"/>
  <ellipse cx="90" cy="34" rx="22" ry="2.5" fill="#5c3a1c"/>
  <!-- handle on right side -->
  <path d="M 120 48 Q 134 52 134 62 Q 134 72 120 72" fill="none" stroke="#1a1108" stroke-width="3"/>
  <!-- neck -->
  <rect x="84" y="92" width="24" height="22" fill="url(#skin4)" stroke="#1a1108" stroke-width="2.5"/>
  <!-- head -->
  <circle cx="96" cy="76" r="30" fill="url(#skin4)" stroke="#1a1108" stroke-width="3"/>
  <ellipse cx="66" cy="76" rx="4" ry="6" fill="url(#skin4)" stroke="#1a1108" stroke-width="2"/>
  <ellipse cx="126" cy="76" rx="4" ry="6" fill="url(#skin4)" stroke="#1a1108" stroke-width="2"/>
  <!-- hair -->
  <path d="M 66 70 Q 64 42 96 38 Q 128 42 126 70 Q 124 56 110 50 Q 96 48 82 50 Q 68 56 66 70 Z" fill="#5c3a1c" stroke="#1a1108" stroke-width="2.5"/>
  <path d="M 76 50 L 78 44 M 100 46 L 102 40 M 118 52 L 122 48" stroke="#3d2817" stroke-width="2" stroke-linecap="round"/>
  <!-- closed-content eyes (^^ shape — happy) -->
  <path d="M 78 76 Q 84 70 90 76" stroke="#1a1108" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 102 76 Q 108 70 114 76" stroke="#1a1108" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- relaxed eyebrows -->
  <path d="M 78 64 Q 84 60 90 64" stroke="#1a1108" stroke-width="2" fill="none"/>
  <path d="M 102 64 Q 108 60 114 64" stroke="#1a1108" stroke-width="2" fill="none"/>
  <!-- nose (visible above mug) -->
  <path d="M 96 78 Q 94 84 96 86" fill="#d4a574" stroke="#1a1108" stroke-width="1"/>
  <!-- pink contented cheeks -->
  <ellipse cx="74" cy="86" rx="4" ry="3" fill="#e89b7a" opacity="0.7"/>
  <ellipse cx="118" cy="86" rx="4" ry="3" fill="#e89b7a" opacity="0.7"/>
  <!-- "Ahhh" indicator -->
  <text x="146" y="58" font-family="serif" font-size="14" font-style="italic" fill="#f0c987" opacity="0.85">~</text>
  <text x="156" y="68" font-family="serif" font-size="11" font-style="italic" fill="#f0c987" opacity="0.7">~</text>
</svg>
