<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- MALE — friendly, warm, comic style with softer features -->
  <defs>
    <pattern id="ht-male" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.0" fill="#000" opacity="0.25"/>
    </pattern>
  </defs>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#000" opacity="0.5"/>
  <!-- T-shirt — friendly blue -->
  <path d="M 44 116 L 32 222 L 160 222 L 148 116 Q 148 100 134 94 L 130 100 L 96 116 L 62 100 L 58 94 Q 44 100 44 116 Z" fill="#5a8aaa" stroke="#000" stroke-width="4"/>
  <path d="M 96 116 L 148 116 Q 148 100 134 94 L 130 100 L 100 116 L 100 222 L 160 222 L 148 116 L 100 116 Z" fill="url(#ht-male)"/>
  <path d="M 76 96 L 96 116 L 116 96" fill="none" stroke="#000" stroke-width="3"/>
  <!-- subtle chest/pec definition -->
  <path d="M 96 116 L 96 142" stroke="#1a3850" stroke-width="1.5" opacity="0.5"/>
  <path d="M 76 132 Q 86 142 96 142 Q 106 142 116 132" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.5"/>
  <!-- arm muscle hint (bicep curve) -->
  <path d="M 38 130 Q 50 132 56 142" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.45"/>
  <path d="M 154 130 Q 142 132 136 142" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.45"/>

  <!-- arms holding mug -->
  <ellipse cx="46" cy="142" rx="14" ry="32" fill="#5a8aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="50" cy="174" r="13" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="148" cy="146" rx="14" ry="36" fill="#5a8aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="148" cy="184" r="13" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- coffee mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#5c3a1c"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#000" stroke-width="3.5"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="84" y="76" width="24" height="22" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- head — softer, friendlier -->
  <circle cx="96" cy="56" r="32" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <ellipse cx="64" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <ellipse cx="128" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <!-- tousled but tidy hair -->
  <path d="M 64 50 Q 60 18 96 14 Q 132 18 128 50 Q 124 28 110 24 Q 96 22 82 24 Q 68 28 64 50 Z" fill="#7a4a26" stroke="#000" stroke-width="4"/>
  <!-- soft hair tufts -->
  <path d="M 80 22 Q 84 16 88 22" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 100 20 Q 104 14 108 22" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- friendly relaxed eyebrows (slightly arched up) -->
  <path d="M 76 50 Q 84 46 92 50" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 100 50 Q 108 46 116 50" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- big warm eyes -->
  <ellipse cx="84" cy="60" rx="6" ry="7" fill="#fff" stroke="#000" stroke-width="3"/>
  <ellipse cx="108" cy="60" rx="6" ry="7" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="84" cy="62" r="3.2" fill="#5c3a1c"/>
  <circle cx="108" cy="62" r="3.2" fill="#5c3a1c"/>
  <circle cx="86" cy="60" r="1.4" fill="#fff"/>
  <circle cx="110" cy="60" r="1.4" fill="#fff"/>
  <!-- soft eyelashes (just hints) -->
  <path d="M 78 56 L 76 53 M 90 56 L 92 53" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 102 56 L 100 53 M 114 56 L 116 53" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- nose (softer) -->
  <path d="M 96 64 Q 93 74 96 78 Q 99 74 96 64 Z" fill="#d8a878" stroke="#000" stroke-width="1.5"/>
  <!-- BIG warm smile -->
  <path d="M 80 80 Q 96 92 112 80" fill="#fff8e8" stroke="#000" stroke-width="3.5"/>
  <path d="M 80 80 Q 96 88 112 80" stroke="#000" stroke-width="2" fill="none"/>
  <!-- pink rosy cheeks (bigger, friendlier) -->
  <ellipse cx="74" cy="74" rx="6" ry="4" fill="#e89b7a" opacity="0.65"/>
  <ellipse cx="118" cy="74" rx="6" ry="4" fill="#e89b7a" opacity="0.65"/>
  <!-- subtle freckle dots -->
  <circle cx="88" cy="68" r="0.8" fill="#a06840" opacity="0.6"/>
  <circle cx="104" cy="68" r="0.8" fill="#a06840" opacity="0.6"/>
</svg>
