<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SKIN-DEEP MILK — sad carton with HUGE crusty top, drips, microwave waves -->
  <defs>
    <pattern id="ht-milk" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#000" opacity="0.4"/>
    </pattern>
  </defs>
  <ellipse cx="64" cy="124" rx="46" ry="5" fill="#000" opacity="0.6"/>
  <!-- microwave radiation lines (it's been nuked) -->
  <path d="M 6 50 Q 12 46 12 54" fill="none" stroke="#ff7733" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 14 56 Q 20 52 20 60" fill="none" stroke="#ff7733" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 122 50 Q 116 46 116 54" fill="none" stroke="#ff7733" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 114 56 Q 108 52 108 60" fill="none" stroke="#ff7733" stroke-width="3.5" stroke-linecap="round"/>
  <!-- carton body — flat cream -->
  <path d="M 28 44 L 28 116 Q 28 122 34 122 L 94 122 Q 100 122 100 116 L 100 44 L 64 28 Z" fill="#fff8e8" stroke="#000" stroke-width="5"/>
  <!-- top fold -->
  <path d="M 28 44 L 64 28 L 100 44" fill="#e8d8b8" stroke="#000" stroke-width="5"/>
  <line x1="64" y1="28" x2="64" y2="44" stroke="#000" stroke-width="3"/>
  <!-- shadow side -->
  <path d="M 100 44 L 100 116 Q 100 122 94 122 L 76 122 L 76 44 Z" fill="url(#ht-milk)"/>
  <!-- HUGE crusty top (the gross feature) -->
  <ellipse cx="64" cy="44" rx="32" ry="7" fill="#c8a878" stroke="#000" stroke-width="4"/>
  <ellipse cx="64" cy="42" rx="26" ry="3" fill="#a08260"/>
  <!-- crust chunks -->
  <circle cx="44" cy="42" r="5" fill="#a08260" stroke="#000" stroke-width="2.5"/>
  <circle cx="84" cy="42" r="4.5" fill="#a08260" stroke="#000" stroke-width="2.5"/>
  <circle cx="64" cy="38" r="6" fill="#8b6f47" stroke="#000" stroke-width="2.5"/>
  <circle cx="54" cy="44" r="3" fill="#5c4a30" stroke="#000" stroke-width="2"/>
  <circle cx="74" cy="46" r="3" fill="#5c4a30" stroke="#000" stroke-width="2"/>
  <!-- steam wisps -->
  <path d="M 44 28 Q 38 16 44 4" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M 64 24 Q 58 10 64 -2" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M 84 28 Q 78 16 84 4" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- BIG MILK label -->
  <rect x="36" y="62" width="56" height="22" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="64" y="80" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="20" font-weight="900" fill="#000">MILK</text>
  <!-- big sad eyes on carton -->
  <circle cx="50" cy="98" r="5" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="78" cy="98" r="5" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="50" cy="100" r="2.5" fill="#000"/>
  <circle cx="78" cy="100" r="2.5" fill="#000"/>
  <!-- frown -->
  <path d="M 50 114 Q 64 108 78 114" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- tilted "RE-HEATED!" tag -->
  <g transform="rotate(-10 14 110)">
    <rect x="-2" y="100" width="50" height="16" fill="#ff7733" stroke="#000" stroke-width="3"/>
    <text x="23" y="111" text-anchor="middle" font-family="Impact, sans-serif" font-size="10" fill="#000">RE-HEATED!</text>
  </g>
</svg>
