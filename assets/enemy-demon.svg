<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- THE SKIN WALKER — lumpy ambulating puddle of denatured milk skin (gross, sad, slow) -->
  <defs>
    <radialGradient id="sw-body" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.7" stop-color="#d8c4a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8906c" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="sw-skin" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#c8a878"/>
      <stop offset="1" stop-color="#7a5840" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="46" ry="5" fill="#3d2817" opacity="0.5"/>
  <!-- floating heat squiggles -->
  <path d="M 8 22 Q 12 14 8 8" stroke="#ff7733" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 120 28 Q 124 20 120 14" stroke="#ff7733" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- BODY: irregular puddle/blob shape — denatured milk -->
  <path d="M 22 86 Q 18 70 28 60 Q 24 48 38 44 Q 36 30 50 32 Q 54 22 66 28 Q 76 22 86 30 Q 100 28 100 44 Q 110 50 106 64 Q 112 76 104 88 Q 110 102 96 108 Q 88 116 70 114 Q 56 118 44 112 Q 28 112 22 100 Q 16 92 22 86 Z" fill="url(#sw-body)"/>
  <!-- ink outline (wobbly to feel organic) -->
  <path d="M 22 86 Q 18 70 28 60 Q 24 48 38 44 Q 36 30 50 32 Q 54 22 66 28 Q 76 22 86 30 Q 100 28 100 44 Q 110 50 106 64 Q 112 76 104 88 Q 110 102 96 108 Q 88 116 70 114 Q 56 118 44 112 Q 28 112 22 100 Q 16 92 22 86 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- LUMPY SKIN CHUNKS hanging off (the gross feature) -->
  <ellipse cx="38" cy="60" rx="9" ry="6" fill="url(#sw-skin)" stroke="#5c3a1c" stroke-width="1.5"/>
  <ellipse cx="66" cy="50" rx="11" ry="7" fill="url(#sw-skin)" stroke="#5c3a1c" stroke-width="1.5"/>
  <ellipse cx="92" cy="58" rx="9" ry="6" fill="url(#sw-skin)" stroke="#5c3a1c" stroke-width="1.5"/>
  <ellipse cx="48" cy="84" rx="7" ry="5" fill="url(#sw-skin)" stroke="#5c3a1c" stroke-width="1.5"/>
  <ellipse cx="84" cy="86" rx="8" ry="6" fill="url(#sw-skin)" stroke="#5c3a1c" stroke-width="1.5"/>
  <!-- darker spots within skin chunks -->
  <circle cx="38" cy="60" r="3" fill="#5c4a30" opacity="0.6"/>
  <circle cx="66" cy="50" r="3.5" fill="#5c4a30" opacity="0.6"/>
  <circle cx="92" cy="58" r="3" fill="#5c4a30" opacity="0.6"/>
  <!-- SAD EYES (peering out from the puddle) -->
  <ellipse cx="48" cy="74" rx="4" ry="5" fill="#fff" stroke="#1a1108" stroke-width="1.8"/>
  <ellipse cx="80" cy="74" rx="4" ry="5" fill="#fff" stroke="#1a1108" stroke-width="1.8"/>
  <ellipse cx="48" cy="76" rx="2" ry="2.5" fill="#1a1108"/>
  <ellipse cx="80" cy="76" rx="2" ry="2.5" fill="#1a1108"/>
  <!-- droopy tear under eye -->
  <path d="M 48 80 Q 49 85 47 88 Q 46 84 48 80 Z" fill="#88bbee" stroke="#1a1108" stroke-width="1"/>
  <!-- frown -->
  <path d="M 54 100 Q 64 96 74 100" stroke="#1a1108" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- DRIPS hanging from underside (it's melting/reforming) -->
  <path d="M 44 116 Q 46 122 44 126 Q 42 122 44 116 Z" fill="url(#sw-skin)" stroke="#3d2817" stroke-width="1.2"/>
  <path d="M 64 118 Q 66 124 64 128 Q 62 124 64 118 Z" fill="url(#sw-skin)" stroke="#3d2817" stroke-width="1.2"/>
  <path d="M 84 116 Q 86 122 84 126 Q 82 122 84 116 Z" fill="url(#sw-skin)" stroke="#3d2817" stroke-width="1.2"/>
  <!-- steam wisps from top -->
  <path d="M 40 24 Q 36 16 42 8" stroke="#aaa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 64 22 Q 60 12 66 4" stroke="#aaa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 86 24 Q 82 16 88 8" stroke="#aaa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
