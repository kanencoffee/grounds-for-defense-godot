<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- REHEATED MILK — sad milk carton with skin/crust on top -->
  <ellipse cx="32" cy="62" rx="20" ry="2.5" fill="#1a1108" opacity="0.4"/>
  <!-- microwave-style heat squiggles around -->
  <path d="M 4 30 Q 8 28 8 32 Q 8 36 4 34" fill="none" stroke="#ff8855" stroke-width="1.5" opacity="0.7"/>
  <path d="M 56 26 Q 60 24 60 28 Q 60 32 56 30" fill="none" stroke="#ff8855" stroke-width="1.5" opacity="0.7"/>
  <path d="M 6 44 Q 2 46 4 50" fill="none" stroke="#ff8855" stroke-width="1.5" opacity="0.7"/>
  <!-- carton body — pale cream -->
  <path d="M 14 22 L 14 58 Q 14 60 16 60 L 48 60 Q 50 60 50 58 L 50 22 L 32 14 Z" fill="#fff8e8" stroke="#1a1108" stroke-width="2.5"/>
  <!-- slight droop / damage -->
  <path d="M 14 22 L 32 14 L 50 22" fill="#f0e8d0" stroke="#1a1108" stroke-width="2.5"/>
  <!-- crusty skin on top -->
  <ellipse cx="32" cy="20" rx="14" ry="3" fill="#d8c4a0" stroke="#8b6f47" stroke-width="1.5"/>
  <ellipse cx="28" cy="19" rx="3" ry="1" fill="#8b6f47" opacity="0.6"/>
  <ellipse cx="36" cy="20" rx="2" ry="0.8" fill="#a08260" opacity="0.7"/>
  <ellipse cx="32" cy="21" rx="5" ry="0.6" fill="#5c4a30" opacity="0.5"/>
  <!-- crust bumps -->
  <circle cx="22" cy="19" r="1.5" fill="#a08260"/>
  <circle cx="42" cy="19" r="1.2" fill="#a08260"/>
  <circle cx="32" cy="17" r="1.8" fill="#8b6f47"/>
  <!-- steam / heat wisps -->
  <path d="M 24 14 Q 22 8 26 4" fill="none" stroke="#aaa" stroke-width="2" opacity="0.6"/>
  <path d="M 32 12 Q 30 6 34 2" fill="none" stroke="#aaa" stroke-width="2" opacity="0.6"/>
  <path d="M 40 14 Q 38 8 42 4" fill="none" stroke="#aaa" stroke-width="2" opacity="0.6"/>
  <!-- "MILK" label -->
  <rect x="20" y="32" width="24" height="14" fill="#fff" stroke="#1a1108" stroke-width="1.5"/>
  <text x="32" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1a1108">MILK</text>
  <!-- sad face -->
  <ellipse cx="22" cy="52" rx="1.5" ry="2" fill="#1a1108"/>
  <ellipse cx="42" cy="52" rx="1.5" ry="2" fill="#1a1108"/>
  <path d="M 24 58 Q 32 54 40 58" fill="none" stroke="#1a1108" stroke-width="1.8" stroke-linecap="round"/>
  <!-- expiration mark -->
  <text x="48" y="30" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#c8302c" font-weight="bold">EXP</text>
</svg>
