<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- REHEATED MILK: lactose burns above 70°C, proteins denature, sugars caramelize wrong → bitter, scorched, lumpy. -->
  <ellipse cx="64" cy="124" rx="48" ry="5" fill="#1a1108" opacity="0.4"/>
  <!-- microwave waves (nuked) -->
  <path d="M 4 50 Q 8 46 8 54 Q 8 62 4 58" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.7"/>
  <path d="M 12 54 Q 16 50 16 58" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.5"/>
  <path d="M 122 46 Q 118 42 118 50 Q 118 58 122 54" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.7"/>
  <path d="M 114 50 Q 110 46 110 54" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.5"/>
  <path d="M 8 80 Q 4 84 6 90" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.7"/>
  <path d="M 122 86 Q 126 90 122 94" fill="none" stroke="#ff8855" stroke-width="2" opacity="0.7"/>
  <!-- carton body -->
  <path d="M 28 44 L 28 116 Q 28 120 32 120 L 96 120 Q 100 120 100 116 L 100 44 L 64 28 Z" fill="#fff8e8" stroke="#1a1108" stroke-width="3.5"/>
  <!-- carton fold lines -->
  <path d="M 28 44 L 64 28 L 100 44" fill="#f0e8d0" stroke="#1a1108" stroke-width="3.5"/>
  <line x1="64" y1="28" x2="64" y2="44" stroke="#1a1108" stroke-width="2" opacity="0.4"/>
  <!-- crusty skin on top of milk (the big "ew" feature) -->
  <ellipse cx="64" cy="40" rx="28" ry="6" fill="#d8c4a0" stroke="#8b6f47" stroke-width="2.5"/>
  <ellipse cx="56" cy="38" rx="6" ry="2" fill="#8b6f47" opacity="0.7"/>
  <ellipse cx="72" cy="40" rx="4" ry="1.5" fill="#a08260" opacity="0.8"/>
  <ellipse cx="64" cy="42" rx="10" ry="1.2" fill="#5c4a30" opacity="0.6"/>
  <!-- crust bumps (visible chunks) -->
  <circle cx="46" cy="38" r="3" fill="#a08260"/>
  <circle cx="82" cy="38" r="2.5" fill="#a08260"/>
  <circle cx="64" cy="34" r="3.5" fill="#8b6f47"/>
  <circle cx="54" cy="40" r="2" fill="#5c4a30"/>
  <circle cx="74" cy="40" r="2.2" fill="#5c4a30"/>
  <!-- steam wisps -->
  <path d="M 48 28 Q 44 16 50 8" fill="none" stroke="#aaa" stroke-width="3" opacity="0.6"/>
  <path d="M 64 24 Q 60 12 66 4" fill="none" stroke="#aaa" stroke-width="3" opacity="0.6"/>
  <path d="M 80 28 Q 76 16 82 8" fill="none" stroke="#aaa" stroke-width="3" opacity="0.6"/>
  <!-- "MILK" label -->
  <rect x="36" y="60" width="56" height="22" fill="#fff" stroke="#1a1108" stroke-width="2.5" rx="2"/>
  <text x="64" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1108">MILK</text>
  <!-- defect callout -->
  <rect x="32" y="86" width="64" height="14" fill="#ff8855" stroke="#1a1108" stroke-width="1.5"/>
  <text x="64" y="96" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#1a1108">REHEATED 3X</text>
  <!-- temperature sticker -->
  <g transform="rotate(-12 16 60)">
    <rect x="2" y="54" width="32" height="14" fill="#ff4422" stroke="#1a1108" stroke-width="1"/>
    <text x="18" y="64" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fff">SCORCHED</text>
  </g>
  <!-- expiration -->
  <g transform="rotate(8 110 92)">
    <rect x="92" y="86" width="32" height="14" fill="#000" stroke="#fff" stroke-width="0.8"/>
    <text x="108" y="92" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#fff">EXP</text>
    <text x="108" y="98" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ff4444">YESTERDAY</text>
  </g>
  <!-- denatured proteins science note -->
  <text x="32" y="110" font-family="monospace" font-size="6" fill="#1a1108">PROTEINS:</text>
  <text x="32" y="116" font-family="monospace" font-size="6" font-weight="bold" fill="#c8302c">DENATURED</text>
  <!-- sad face -->
  <ellipse cx="48" cy="50" rx="2" ry="2.5" fill="#1a1108"/>
  <ellipse cx="80" cy="50" rx="2" ry="2.5" fill="#1a1108"/>
  <path d="M 50 56 Q 64 50 78 56" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
</svg>
