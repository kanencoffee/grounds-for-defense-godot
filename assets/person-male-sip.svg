<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- MALE — sipping happily -->
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#000" opacity="0.5"/>
  <!-- steam rising -->
  <path d="M 80 14 Q 72 -2 84 -10" stroke="#aaa" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 96 12 Q 86 -4 100 -14" stroke="#aaa" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 112 14 Q 122 -2 110 -10" stroke="#aaa" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- T-shirt -->
  <path d="M 44 116 L 32 222 L 160 222 L 148 116 Q 148 100 134 94 L 130 100 L 96 116 L 62 100 L 58 94 Q 44 100 44 116 Z" fill="#5a8aaa" stroke="#000" stroke-width="4"/>
  <path d="M 76 96 L 96 116 L 116 96" fill="none" stroke="#000" stroke-width="3"/>
  <!-- subtle chest/pec definition -->
  <path d="M 96 116 L 96 142" stroke="#1a3850" stroke-width="1.5" opacity="0.5"/>
  <path d="M 76 132 Q 86 142 96 142 Q 106 142 116 132" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.5"/>
  <!-- arm muscle hint (bicep curve) -->
  <path d="M 38 130 Q 50 132 56 142" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.45"/>
  <path d="M 154 130 Q 142 132 136 142" fill="none" stroke="#1a3850" stroke-width="1.5" opacity="0.45"/>

  <!-- right arm relaxed -->
  <ellipse cx="148" cy="146" rx="14" ry="36" fill="#5a8aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="148" cy="184" r="13" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- left arm raised -->
  <path d="M 32 130 Q 28 110 56 96 L 76 90 Q 84 96 80 110 L 60 142 Z" fill="#5a8aaa" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="42" cy="124" rx="14" ry="22" fill="#5a8aaa" stroke="#000" stroke-width="3.5"/>
  <circle cx="78" cy="92" r="11" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <!-- HEAD -->
  <rect x="84" y="76" width="24" height="22" fill="#f5d4a8" stroke="#000" stroke-width="3.5"/>
  <circle cx="96" cy="56" r="32" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <ellipse cx="64" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <ellipse cx="128" cy="56" rx="5" ry="8" fill="#f5d4a8" stroke="#000" stroke-width="3"/>
  <!-- hair -->
  <path d="M 64 50 Q 60 18 96 14 Q 132 18 128 50 Q 124 28 110 24 Q 96 22 82 24 Q 68 28 64 50 Z" fill="#7a4a26" stroke="#000" stroke-width="4"/>
  <path d="M 80 22 Q 84 16 88 22" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 100 20 Q 104 14 108 22" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- relaxed eyebrows -->
  <path d="M 76 48 Q 84 44 92 48" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 100 48 Q 108 44 116 48" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- happy ^^ closed eyes -->
  <path d="M 76 60 Q 84 54 92 60" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 60 Q 108 54 116 60" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 96 64 Q 93 74 96 78 Q 99 74 96 64 Z" fill="#d8a878" stroke="#000" stroke-width="1.5"/>
  <!-- pink contented cheeks -->
  <ellipse cx="74" cy="74" rx="7" ry="4" fill="#e89b7a" opacity="0.85"/>
  <ellipse cx="118" cy="74" rx="7" ry="4" fill="#e89b7a" opacity="0.85"/>
  <!-- COFFEE MUG at chin -->
  <path d="M 70 84 L 74 134 Q 74 140 80 140 L 112 140 Q 118 140 118 134 L 122 84 Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="96" cy="84" rx="26" ry="5" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <ellipse cx="96" cy="82" rx="20" ry="2.5" fill="#5c3a1c"/>
  <path d="M 122 96 Q 134 100 134 110 Q 134 122 122 122" fill="none" stroke="#000" stroke-width="3.5"/>
  <!-- AHH burst -->
  <g transform="translate(140 100)">
    <polygon points="0,12 6,2 14,8 22,0 28,12 22,18 28,22 18,26 22,32 12,28 6,32 8,22 -2,18" fill="#ffd24a" stroke="#000" stroke-width="2.5"/>
    <text x="14" y="22" text-anchor="middle" font-family="Impact, sans-serif" font-size="10" font-weight="bold" fill="#000">AHH!</text>
  </g>
