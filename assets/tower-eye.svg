<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- THE EYE (sight): visual inspection — spots mold, foreign matter, color defects -->
  <defs>
    <radialGradient id="iris" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#5b8a4a"/>
      <stop offset="0.7" stop-color="#3d5c2a"/>
      <stop offset="1" stop-color="#1a2810"/>
    </radialGradient>
  </defs>
  <!-- magnifying glass handle -->
  <rect x="62" y="62" width="10" height="30" rx="3" fill="#5c3a1c" stroke="#1a1108" stroke-width="2.5" transform="rotate(45 67 77)"/>
  <!-- glass ring -->
  <circle cx="42" cy="42" r="32" fill="none" stroke="#5c3a1c" stroke-width="6"/>
  <circle cx="42" cy="42" r="28" fill="#fff" stroke="#1a1108" stroke-width="2" opacity="0.4"/>
  <!-- eye -->
  <ellipse cx="42" cy="42" rx="22" ry="14" fill="#fff" stroke="#1a1108" stroke-width="2"/>
  <circle cx="42" cy="42" r="11" fill="url(#iris)" stroke="#1a1108" stroke-width="1.5"/>
  <circle cx="42" cy="42" r="5" fill="#0a0604"/>
  <circle cx="44" cy="40" r="2" fill="#fff" opacity="0.9"/>
  <!-- eyelashes -->
  <path d="M 22 30 L 18 26 M 28 24 L 28 18 M 36 22 L 36 16 M 48 22 L 48 16 M 56 24 L 56 18 M 62 30 L 66 26" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- glass shine -->
  <ellipse cx="32" cy="32" rx="6" ry="3" fill="#fff" opacity="0.7"/>
</svg>
