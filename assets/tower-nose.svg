<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- THE NOSE (smell): aroma evaluation — slows/weakens nearby bad coffee in radius -->
  <defs>
    <radialGradient id="skin2" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#f5d4a8"/>
      <stop offset="1" stop-color="#c89870"/>
    </radialGradient>
  </defs>
  <!-- aroma curls coming up -->
  <path d="M 28 14 Q 20 10 24 4 Q 30 0 26 -4" stroke="#88aaff" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 48 8 Q 40 4 44 -2 Q 52 -6 48 -10" stroke="#88aaff" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 68 14 Q 76 10 72 4 Q 66 0 70 -4" stroke="#88aaff" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- nose bridge -->
  <path d="M 38 22 L 36 56 Q 36 66 42 70 L 54 70 Q 60 66 60 56 L 58 22 Q 56 18 48 18 Q 40 18 38 22 Z" fill="url(#skin2)" stroke="#1a1108" stroke-width="3"/>
  <!-- nose tip highlight -->
  <ellipse cx="48" cy="50" rx="10" ry="6" fill="#f5d4a8" opacity="0.8"/>
  <!-- bridge shading -->
  <path d="M 44 24 L 44 50" stroke="#a07852" stroke-width="2" opacity="0.5"/>
  <path d="M 52 24 L 52 50" stroke="#a07852" stroke-width="2" opacity="0.5"/>
  <!-- nostrils -->
  <ellipse cx="42" cy="62" rx="3.5" ry="5" fill="#1a1108"/>
  <ellipse cx="54" cy="62" rx="3.5" ry="5" fill="#1a1108"/>
  <!-- crease above nostrils -->
  <path d="M 38 60 L 42 56 M 54 56 L 58 60" stroke="#a07852" stroke-width="1.5" opacity="0.7"/>
  <!-- "SNIFF" arc indicator -->
  <path d="M 14 78 Q 48 92 82 78" fill="none" stroke="#88aaff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="48" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#88aaff">AROMA</text>
</svg>
