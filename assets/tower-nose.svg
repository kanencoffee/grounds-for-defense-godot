<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- NOSE GOES — big cartoon nose with bold blue aroma waves coming up -->
  <!-- shadow -->
  <ellipse cx="48" cy="86" rx="26" ry="3" fill="#000" opacity="0.5"/>
  <!-- aroma waves rising (concentric blue arcs) -->
  <path d="M 14 18 Q 48 0 82 18" fill="none" stroke="#4488dd" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
  <path d="M 22 14 Q 48 -4 74 14" fill="none" stroke="#4488dd" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3"/>
  <!-- aroma curl swirls -->
  <path d="M 26 22 Q 22 14 28 8 Q 32 14 26 18" fill="none" stroke="#4488dd" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 70 22 Q 74 14 68 8 Q 64 14 70 18" fill="none" stroke="#4488dd" stroke-width="3.5" stroke-linecap="round"/>
  <!-- nose bridge (big and bold) -->
  <path d="M 36 26 L 32 60 Q 32 70 40 76 L 56 76 Q 64 70 64 60 L 60 26 Q 56 22 48 22 Q 40 22 36 26 Z" fill="#f5d4a8" stroke="#000" stroke-width="5"/>
  <!-- highlight on nose bridge -->
  <ellipse cx="42" cy="40" rx="4" ry="14" fill="#fff" opacity="0.7"/>
  <!-- shadow on right side of bridge -->
  <path d="M 56 26 L 60 26 L 64 60 Q 64 70 56 76 L 56 76 Z" fill="#c89870"/>
  <!-- nose tip -->
  <ellipse cx="48" cy="58" rx="14" ry="10" fill="#f5d4a8" stroke="#000" stroke-width="4"/>
  <ellipse cx="44" cy="54" rx="5" ry="3" fill="#fff" opacity="0.8"/>
  <!-- nostrils (big black) -->
  <ellipse cx="42" cy="66" rx="4" ry="6" fill="#000"/>
  <ellipse cx="54" cy="66" rx="4" ry="6" fill="#000"/>
  <!-- crease above nostrils -->
  <path d="M 38 64 L 42 60 M 54 60 L 58 64" stroke="#a07852" stroke-width="2.5" stroke-linecap="round"/>
  <!-- "SNIFF!" comic burst -->
  <g transform="translate(60 -4)">
    <polygon points="0,12 6,2 14,8 22,0 28,12 22,18 28,22 18,26 22,32 12,28 6,32 8,22 -2,18" fill="#ffd24a" stroke="#000" stroke-width="3"/>
    <text x="14" y="22" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" font-weight="bold" fill="#000">SNIFF!</text>
  </g>
</svg>
