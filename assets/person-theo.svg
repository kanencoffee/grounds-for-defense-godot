<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- THEO — bearded barista, sharper jaw + cheekbones, fitted henley showing chest, bicep hint -->
  <defs>
    <radialGradient id="t-skin" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#e8c090"/>
      <stop offset="1" stop-color="#a87852" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="t-shirt" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#3a4a4a"/>
      <stop offset="1" stop-color="#1a2a2a" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#3d2817" opacity="0.35"/>
  <!-- fitted dark henley (broader shoulders, tapered waist) -->
  <path d="M 38 122 Q 30 168 32 200 L 28 222 L 164 222 L 160 200 Q 162 168 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="url(#t-shirt)"/>
  <path d="M 38 122 Q 30 168 32 200 L 28 222 L 164 222 L 160 200 Q 162 168 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- DEFINED PEC LINE -->
  <path d="M 96 116 L 96 152" stroke="#0a1a1a" stroke-width="1.8" opacity="0.85"/>
  <path d="M 70 132 Q 86 152 96 152 Q 106 152 122 132" fill="none" stroke="#0a1a1a" stroke-width="1.8" opacity="0.7"/>
  <!-- chest swell wash -->
  <path d="M 68 128 Q 80 140 96 138 Q 112 140 124 128" fill="#1a3a3a" opacity="0.4"/>
  <!-- waist tapered hint -->
  <path d="M 50 175 Q 96 180 142 175" fill="none" stroke="#0a1a1a" stroke-width="1.2" opacity="0.5"/>
  <!-- HENLEY BUTTON PLACKET (V opening at top) -->
  <path d="M 88 92 L 88 130 L 104 130 L 104 92" fill="#5a6a6a" stroke="#0a1a1a" stroke-width="1.5"/>
  <circle cx="96" cy="106" r="1.5" fill="#0a1a1a"/>
  <circle cx="96" cy="120" r="1.5" fill="#0a1a1a"/>
  <!-- chest hair / skin showing in V -->
  <path d="M 88 92 L 96 110 L 104 92" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- arms (defined biceps) -->
  <path d="M 32 130 Q 28 152 38 174 Q 52 178 56 156 Q 60 132 56 122 Z" fill="url(#t-shirt)" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 160 130 Q 164 152 154 174 Q 140 178 136 156 Q 132 132 136 122 Z" fill="url(#t-shirt)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- bicep contour -->
  <path d="M 36 144 Q 44 152 50 144" fill="none" stroke="#0a1a1a" stroke-width="1.2" opacity="0.6"/>
  <path d="M 156 144 Q 148 152 142 144" fill="none" stroke="#0a1a1a" stroke-width="1.2" opacity="0.6"/>
  <!-- forearm exposed, with TATTOO -->
  <ellipse cx="42" cy="190" rx="11" ry="14" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="150" cy="190" rx="11" ry="14" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
