  <ellipse cx="60" cy="58" rx="4" ry="7" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="132" cy="58" rx="4" ry="7" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- cheekbones -->
  <path d="M 68 64 Q 74 70 76 76" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 124 64 Q 118 70 116 76" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- thick curly hair, side-swept -->
  <path d="M 60 50 Q 50 8 96 8 Q 142 8 132 50 Q 138 30 122 22 Q 96 18 70 22 Q 54 30 60 50 Z" fill="#1a0808" stroke="#3d2817" stroke-width="2"/>
  <!-- voluminous curls -->
  <circle cx="74" cy="14" r="6" fill="#1a0808" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="92" cy="6" r="7" fill="#1a0808" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="110" cy="10" r="6" fill="#1a0808" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="124" cy="20" r="5" fill="#1a0808" stroke="#3d2817" stroke-width="1.2"/>
  <circle cx="64" cy="28" r="4" fill="#1a0808" stroke="#3d2817" stroke-width="1.2"/>
  <!-- BOLD black square frame glasses -->
  <rect x="64" y="50" width="22" height="18" rx="3" fill="#fff" fill-opacity="0.08" stroke="#1a1108" stroke-width="3"/>
  <rect x="106" y="50" width="22" height="18" rx="3" fill="#fff" fill-opacity="0.08" stroke="#1a1108" stroke-width="3"/>
  <line x1="86" y1="58" x2="106" y2="58" stroke="#1a1108" stroke-width="3"/>
  <!-- intense focused eyes -->
  <circle cx="75" cy="60" r="2.5" fill="#3d2817"/>
  <circle cx="117" cy="60" r="2.5" fill="#3d2817"/>
  <circle cx="76" cy="59" r="0.9" fill="#fff"/>
  <circle cx="118" cy="59" r="0.9" fill="#fff"/>
  <!-- sharp dark brows above glasses -->
  <path d="M 64 46 Q 76 42 88 46" stroke="#1a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 104 46 Q 116 42 128 46" stroke="#1a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- nose with bridge definition -->
  <path d="M 96 70 Q 91 80 96 84 Q 101 80 96 70 Z" fill="#a86848" stroke="#3d2817" stroke-width="1.2"/>
  <path d="M 92 78 Q 96 82 100 78" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- WELL-GROOMED FULL BEARD (sculpted) -->
  <path d="M 64 78 Q 64 102 80 108 Q 96 110 112 108 Q 128 102 128 78 Q 124 92 96 96 Q 68 92 64 78 Z" fill="#1a0808" stroke="#3d2817" stroke-width="2"/>
  <!-- mustache (defined) -->
  <path d="M 78 80 Q 88 84 96 82 Q 104 84 114 80 Q 110 90 96 90 Q 82 90 78 80 Z" fill="#1a0808" stroke="#3d2817" stroke-width="1.5"/>
  <!-- subtle distinguished grey accent -->
  <path d="M 76 96 Q 78 100 80 104" stroke="#888" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- confident smirk in beard -->
  <path d="M 86 92 Q 96 96 110 92" stroke="#3d1818" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- slight smirk lift -->
  <path d="M 108 92 L 112 88" stroke="#3d1818" stroke-width="1.2" stroke-linecap="round"/>
  <!-- cheek warmth -->
  <ellipse cx="72" cy="72" rx="5" ry="3" fill="#a83040" opacity="0.35"/>
  <ellipse cx="120" cy="72" rx="5" ry="3" fill="#a83040" opacity="0.35"/>
</svg>
