  <path d="M 148 182 Q 146 186 148 190" stroke="#5c3a1c" stroke-width="0.7" fill="none"/>
  <ellipse cx="154" cy="194" rx="2.5" ry="3" fill="#1a1108" opacity="0.7"/>
  <!-- hand holding mug -->
  <circle cx="46" cy="206" r="11" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="146" cy="208" r="11" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff8e8" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#5c3a1c" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#3d2817"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- thick muscular neck -->
  <path d="M 80 76 L 78 96 Q 96 110 114 96 L 112 76 Z" fill="url(#t-skin)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- adam's apple / collarbone hint -->
  <path d="M 96 88 L 96 96" stroke="#3d2817" stroke-width="0.6" opacity="0.5"/>
