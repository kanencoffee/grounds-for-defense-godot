<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- TASTE-MASTER — big mouth with tongue out + coffee cup, comic style -->
  <ellipse cx="48" cy="92" rx="32" ry="3" fill="#000" opacity="0.5"/>
  <!-- mouth outline -->
  <path d="M 8 32 Q 8 18 24 16 L 72 16 Q 88 18 88 32 L 88 50 Q 88 64 72 66 L 24 66 Q 8 64 8 50 Z" fill="#000" stroke="#000" stroke-width="5"/>
  <!-- upper teeth (white block, comic style) -->
  <rect x="14" y="20" width="68" height="14" fill="#fff" stroke="#000" stroke-width="3"/>
  <line x1="24" y1="20" x2="24" y2="34" stroke="#000" stroke-width="2"/>
  <line x1="34" y1="20" x2="34" y2="34" stroke="#000" stroke-width="2"/>
  <line x1="48" y1="20" x2="48" y2="34" stroke="#000" stroke-width="2"/>
  <line x1="62" y1="20" x2="62" y2="34" stroke="#000" stroke-width="2"/>
  <line x1="72" y1="20" x2="72" y2="34" stroke="#000" stroke-width="2"/>
  <!-- BIG pink tongue (the star) -->
  <ellipse cx="48" cy="56" rx="32" ry="14" fill="#e85a78" stroke="#000" stroke-width="5"/>
  <!-- tongue centerline -->
  <path d="M 48 44 Q 44 56 48 70" stroke="#a82048" stroke-width="3" fill="none"/>
  <!-- taste buds (comic dots) -->
  <circle cx="34" cy="52" r="2" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="2" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="62" cy="52" r="2" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="40" cy="60" r="1.5" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="56" cy="60" r="1.5" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <!-- shine on tongue -->
  <ellipse cx="34" cy="50" rx="6" ry="2" fill="#fff" opacity="0.6"/>
  <!-- coffee cup at bottom right -->
  <path d="M 70 76 L 74 92 L 86 92 L 90 76 Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="80" cy="76" rx="10" ry="2" fill="#3d2817" stroke="#000" stroke-width="2"/>
  <path d="M 90 80 Q 96 84 96 88" fill="none" stroke="#000" stroke-width="3"/>
  <!-- steam from cup -->
  <path d="M 80 74 Q 76 68 80 62" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- "TASTE!" burst -->
  <g transform="translate(-2 64)">
    <polygon points="0,12 6,2 14,8 22,0 28,12 22,18 28,22 18,26 22,32 12,28 6,32 8,22 -2,18" fill="#ffd24a" stroke="#000" stroke-width="3"/>
    <text x="14" y="22" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" font-weight="bold" fill="#000">TASTE!</text>
  </g>
</svg>
