<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- MAYA — bookish + warm; messy bun, tortoiseshell glasses, beige sweater, holds mug + book -->
  <defs>
    <radialGradient id="m-page" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f0dcb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-skin" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#c89070"/>
      <stop offset="1" stop-color="#9a6448" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="m-sweater" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#e8d8b0"/>
      <stop offset="1" stop-color="#a89060" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <ellipse cx="96" cy="128" rx="120" ry="120" fill="url(#m-page)"/>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#3d2817" opacity="0.3"/>
  <!-- chunky cream cable-knit sweater (watercolor) -->
  <path d="M 38 122 L 28 222 L 164 222 L 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="url(#m-sweater)"/>
  <!-- ink outline -->
  <path d="M 38 122 L 28 222 L 164 222 L 154 122 Q 154 100 138 92 L 96 116 L 54 92 Q 38 100 38 122 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- subtle bust contour (soft ink) -->
  <path d="M 64 134 Q 84 148 96 144 Q 108 148 128 134" fill="none" stroke="#5c3a1c" stroke-width="1.2" opacity="0.6"/>
  <!-- cable knit lines -->
  <path d="M 56 130 L 50 215 M 80 132 L 76 218 M 112 132 L 116 218 M 138 130 L 144 215" stroke="#8b7050" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- v-neck collar -->
  <path d="M 78 92 L 96 116 L 114 92" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <!-- arms -->
  <ellipse cx="44" cy="148" rx="14" ry="34" fill="url(#m-sweater)"/>
  <ellipse cx="44" cy="148" rx="14" ry="34" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="148" cy="148" rx="14" ry="34" fill="url(#m-sweater)"/>
  <ellipse cx="148" cy="148" rx="14" ry="34" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <!-- left hand holding mug -->
  <circle cx="48" cy="178" r="11" fill="url(#m-skin)"/>
  <circle cx="48" cy="178" r="11" fill="none" stroke="#3d2817" stroke-width="1.5"/>
  <!-- right hand holding book -->
  <circle cx="148" cy="184" r="11" fill="url(#m-skin)"/>
  <circle cx="148" cy="184" r="11" fill="none" stroke="#3d2817" stroke-width="1.5"/>
  <!-- mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff8e8" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#5c3a1c" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#3d2817"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- book in right hand -->
  <rect x="138" y="178" width="22" height="28" rx="1" fill="#a83040" stroke="#3d2817" stroke-width="1.5"/>
  <line x1="138" y1="184" x2="160" y2="184" stroke="#3d2817" stroke-width="1"/>
  <line x1="142" y1="190" x2="156" y2="190" stroke="#fff" stroke-width="0.5" opacity="0.6"/>
  <line x1="142" y1="194" x2="156" y2="194" stroke="#fff" stroke-width="0.5" opacity="0.6"/>
  <!-- neck -->
  <rect x="84" y="76" width="24" height="22" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- head — warm brown skin -->
  <circle cx="96" cy="56" r="32" fill="url(#m-skin)" stroke="#3d2817" stroke-width="2"/>
  <ellipse cx="64" cy="56" rx="5" ry="8" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="128" cy="56" rx="5" ry="8" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- gold hoop earrings -->
  <circle cx="62" cy="64" r="3.5" fill="none" stroke="#c8a030" stroke-width="2"/>
  <circle cx="130" cy="64" r="3.5" fill="none" stroke="#c8a030" stroke-width="2"/>
  <!-- messy bun on top + side wisps -->
  <path d="M 70 32 Q 64 14 96 12 Q 128 14 122 32 Q 116 24 96 22 Q 76 24 70 32 Z" fill="#1a1108" stroke="#3d2817" stroke-width="2"/>
  <ellipse cx="96" cy="14" rx="14" ry="10" fill="#1a1108" stroke="#3d2817" stroke-width="2"/>
  <!-- bun wraps -->
  <path d="M 86 8 Q 96 6 106 8" stroke="#3d2817" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- side hair wisps -->
  <path d="M 68 36 Q 64 50 70 60" stroke="#1a1108" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 124 36 Q 128 50 122 60" stroke="#1a1108" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- TORTOISESHELL GLASSES (the nerdy hook) -->
  <ellipse cx="82" cy="60" rx="12" ry="10" fill="#fff" fill-opacity="0.15" stroke="#5c3a1c" stroke-width="2.5"/>
  <ellipse cx="110" cy="60" rx="12" ry="10" fill="#fff" fill-opacity="0.15" stroke="#5c3a1c" stroke-width="2.5"/>
  <line x1="94" y1="60" x2="98" y2="60" stroke="#5c3a1c" stroke-width="2.5"/>
  <!-- tortoiseshell texture -->
  <circle cx="76" cy="56" r="1.5" fill="#3d2817" opacity="0.7"/>
  <circle cx="88" cy="64" r="1.2" fill="#3d2817" opacity="0.7"/>
  <circle cx="106" cy="56" r="1.5" fill="#3d2817" opacity="0.7"/>
  <circle cx="116" cy="64" r="1.2" fill="#3d2817" opacity="0.7"/>
  <!-- eyes inside glasses -->
  <circle cx="82" cy="61" r="2.5" fill="#3d2817"/>
  <circle cx="110" cy="61" r="2.5" fill="#3d2817"/>
  <circle cx="83" cy="60" r="0.8" fill="#fff"/>
  <circle cx="111" cy="60" r="0.8" fill="#fff"/>
  <!-- subtle lashes -->
  <path d="M 76 54 L 74 51 M 88 54 L 90 51 M 104 54 L 102 51 M 116 54 L 118 51" stroke="#1a1108" stroke-width="1" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 96 64 Q 93 74 96 78 Q 99 74 96 64 Z" fill="#a86848" stroke="#3d2817" stroke-width="1.2"/>
  <!-- soft warm smile (lipstick) -->
  <path d="M 84 80 Q 96 88 108 80" fill="#c84858" stroke="#3d2817" stroke-width="1.5"/>
  <!-- rosy cheeks (watercolor) -->
  <ellipse cx="74" cy="74" rx="6" ry="3.5" fill="#d86060" opacity="0.4"/>
  <ellipse cx="118" cy="74" rx="6" ry="3.5" fill="#d86060" opacity="0.4"/>
</svg>
