<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 240" width="192" height="240">
  <!-- MAYA — bookish + confident; defined features, pronounced lips, fitted top -->
  <defs>
    <radialGradient id="m-skin" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#c89070"/>
      <stop offset="1" stop-color="#9a6448" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="m-top" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#e8b450"/>
      <stop offset="1" stop-color="#a8741c" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <ellipse cx="96" cy="222" rx="62" ry="6" fill="#3d2817" opacity="0.35"/>
  <!-- fitted scoop-neck top — defined torso shape -->
  <path d="M 42 122 Q 36 168 38 200 L 32 222 L 160 222 L 154 200 Q 156 168 150 122 Q 150 102 134 94 L 96 116 L 58 94 Q 42 102 42 122 Z" fill="url(#m-top)"/>
  <path d="M 42 122 Q 36 168 38 200 L 32 222 L 160 222 L 154 200 Q 156 168 150 122 Q 150 102 134 94 L 96 116 L 58 94 Q 42 102 42 122 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
  <!-- defined bust silhouette (more pronounced curve) -->
  <path d="M 56 130 Q 76 156 96 150 Q 116 156 136 130" fill="none" stroke="#7a4818" stroke-width="1.8" opacity="0.7"/>
  <path d="M 64 144 Q 80 154 96 152 Q 112 154 128 144" fill="none" stroke="#7a4818" stroke-width="1.2" opacity="0.45"/>
  <!-- waistline cinch -->
  <path d="M 50 170 Q 96 178 142 170" fill="none" stroke="#7a4818" stroke-width="1.5" opacity="0.55"/>
  <!-- scoop neck -->
  <path d="M 78 96 Q 96 110 114 96" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- collarbone hint -->
  <path d="M 80 102 Q 96 106 112 102" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- arms, defined -->
  <ellipse cx="44" cy="148" rx="13" ry="34" fill="url(#m-top)" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="148" cy="148" rx="13" ry="34" fill="url(#m-top)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- left hand with mug -->
  <circle cx="48" cy="178" r="11" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <circle cx="148" cy="184" r="11" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- mug -->
  <path d="M 56 158 L 62 192 Q 62 198 68 198 L 96 198 Q 102 198 102 192 L 108 158 Z" fill="#fff8e8" stroke="#3d2817" stroke-width="1.8"/>
  <ellipse cx="82" cy="158" rx="26" ry="4" fill="#5c3a1c" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="82" cy="156" rx="20" ry="2" fill="#3d2817"/>
  <path d="M 108 168 Q 122 172 122 180 Q 122 188 108 188" fill="none" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 70 152 Q 66 144 72 136" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 88 150 Q 84 140 90 132" stroke="#aaa" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- elegant book in right hand -->
  <rect x="138" y="178" width="22" height="28" rx="1" fill="#a83040" stroke="#3d2817" stroke-width="1.5"/>
  <line x1="138" y1="184" x2="160" y2="184" stroke="#3d2817" stroke-width="1"/>
  <!-- long graceful neck -->
  <path d="M 84 76 L 80 100 Q 96 110 112 100 L 108 76 Z" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.8"/>
  <!-- collarbone shadow -->
  <path d="M 80 102 L 80 100 Q 96 106 112 100 L 112 102" stroke="#3d2817" stroke-width="1" opacity="0.4"/>
  <!-- heart-shaped face — defined cheekbones, jaw -->
  <path d="M 64 56 Q 60 32 80 26 Q 96 22 112 26 Q 132 32 128 56 Q 128 70 122 78 Q 116 88 96 90 Q 76 88 70 78 Q 64 70 64 56 Z" fill="url(#m-skin)" stroke="#3d2817" stroke-width="2"/>
  <ellipse cx="64" cy="58" rx="4" ry="7" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <ellipse cx="128" cy="58" rx="4" ry="7" fill="url(#m-skin)" stroke="#3d2817" stroke-width="1.5"/>
  <!-- cheekbones (subtle ink contour) -->
  <path d="M 70 64 Q 76 70 78 76" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 122 64 Q 116 70 114 76" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- jawline contour -->
  <path d="M 76 86 Q 96 90 116 86" stroke="#5c3a1c" stroke-width="1" fill="none" opacity="0.45"/>
  <!-- gold hoop earrings (statement) -->
  <circle cx="62" cy="68" r="5" fill="none" stroke="#d8a830" stroke-width="2.5"/>
  <circle cx="130" cy="68" r="5" fill="none" stroke="#d8a830" stroke-width="2.5"/>
  <!-- voluminous wavy hair, partially down -->
  <path d="M 64 56 Q 56 16 96 10 Q 136 16 128 56 Q 138 78 132 100 Q 122 96 120 80 Q 118 32 96 26 Q 74 32 72 80 Q 70 96 60 100 Q 54 78 64 56 Z" fill="#1a0a08" stroke="#3d2817" stroke-width="2"/>
  <!-- hair flowing past shoulders -->
  <path d="M 60 100 Q 50 130 56 170 L 78 124 Z" fill="#1a0a08" stroke="#3d2817" stroke-width="1.8"/>
  <path d="M 132 100 Q 142 130 136 170 L 114 124 Z" fill="#1a0a08" stroke="#3d2817" stroke-width="1.8"/>
  <!-- side-swept bangs -->
  <path d="M 76 32 Q 84 38 100 36 Q 110 32 118 30 Q 110 28 100 30 Q 84 30 76 32 Z" fill="#1a0a08" stroke="#3d2817" stroke-width="1.5"/>
  <!-- TORTOISESHELL GLASSES -->
  <ellipse cx="82" cy="60" rx="12" ry="10" fill="#fff" fill-opacity="0.1" stroke="#5c3a1c" stroke-width="2.5"/>
  <ellipse cx="110" cy="60" rx="12" ry="10" fill="#fff" fill-opacity="0.1" stroke="#5c3a1c" stroke-width="2.5"/>
  <line x1="94" y1="60" x2="98" y2="60" stroke="#5c3a1c" stroke-width="2.5"/>
  <circle cx="76" cy="56" r="1.5" fill="#3d2817" opacity="0.7"/>
  <circle cx="116" cy="64" r="1.2" fill="#3d2817" opacity="0.7"/>
  <!-- almond-shaped eyes (eye contact, confident) -->
  <path d="M 76 60 Q 82 56 88 60 Q 82 64 76 60 Z" fill="#fff" stroke="#1a1108" stroke-width="1.5"/>
  <path d="M 104 60 Q 110 56 116 60 Q 110 64 104 60 Z" fill="#fff" stroke="#1a1108" stroke-width="1.5"/>
  <ellipse cx="83" cy="60" rx="2.2" ry="2.5" fill="#3d1808"/>
  <ellipse cx="111" cy="60" rx="2.2" ry="2.5" fill="#3d1808"/>
  <circle cx="84" cy="59" r="0.8" fill="#fff"/>
  <circle cx="112" cy="59" r="0.8" fill="#fff"/>
  <!-- prominent eyelashes -->
  <path d="M 78 56 L 76 53 M 84 55 L 84 51 M 90 56 L 92 53" stroke="#1a1108" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 102 56 L 100 53 M 108 55 L 108 51 M 114 56 L 116 53" stroke="#1a1108" stroke-width="1.5" stroke-linecap="round"/>
  <!-- sculpted brows -->
  <path d="M 74 50 Q 84 46 90 50" stroke="#1a0a08" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 102 50 Q 108 46 118 50" stroke="#1a0a08" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- defined nose -->
  <path d="M 96 64 Q 92 76 96 82 Q 100 76 96 64 Z" fill="#a86848" stroke="#3d2817" stroke-width="1.2"/>
  <!-- FULL LIPS — confident slight smile -->
  <path d="M 80 84 Q 96 90 112 84" fill="#c84858" stroke="#3d2817" stroke-width="1.5"/>
  <path d="M 80 84 Q 96 86 112 84" stroke="#8b1c2c" stroke-width="0.8" fill="none"/>
  <path d="M 84 84 Q 96 80 108 84" fill="#e87080" stroke="none"/>
  <!-- subtle smirk lift on right -->
  <path d="M 110 85 L 112 82" stroke="#3d2817" stroke-width="1.2" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <ellipse cx="74" cy="76" rx="6" ry="4" fill="#d86060" opacity="0.45"/>
  <ellipse cx="118" cy="76" rx="6" ry="4" fill="#d86060" opacity="0.45"/>
  <!-- beauty mark by lip -->
  <circle cx="118" cy="82" r="1" fill="#3d1808"/>
</svg>
