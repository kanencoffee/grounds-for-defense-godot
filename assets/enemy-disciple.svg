<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SIR STALES-A-LOT — comic book style — bold outlines, flat colors, halftone shading, action pose -->
  <defs>
    <pattern id="halftone-dark" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#1a1108" opacity="0.55"/>
    </pattern>
    <pattern id="halftone-mid" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.0" fill="#3d2817" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="64" cy="120" rx="40" ry="4" fill="#000" opacity="0.6"/>
  <!-- motion lines (action pose feel) -->
  <line x1="6" y1="44" x2="20" y2="42" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="4" y1="64" x2="18" y2="62" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="84" x2="20" y2="82" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- bean body — flat color base -->
  <ellipse cx="64" cy="68" rx="44" ry="48" fill="#9a7a52" stroke="#000" stroke-width="5"/>
  <!-- shadow side (flat darker color, no gradient) -->
  <path d="M 64 22 Q 90 22 106 60 Q 110 80 100 100 Q 90 116 64 116 Q 64 22 64 22 Z" fill="#5c3d20"/>
  <!-- halftone dot shading on the shadow side -->
  <path d="M 64 22 Q 90 22 106 60 Q 110 80 100 100 Q 90 116 64 116 Q 64 22 64 22 Z" fill="url(#halftone-dark)"/>
  <!-- highlight side (flat lighter) -->
  <ellipse cx="44" cy="50" rx="14" ry="20" fill="#c8a878"/>
  <!-- bold center crease -->
  <path d="M 64 22 Q 56 68 64 114" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <!-- mold spot 1 — comic-flat green -->
  <circle cx="86" cy="86" r="9" fill="#5a8a3a" stroke="#000" stroke-width="3"/>
  <circle cx="84" cy="84" r="3" fill="#1a4818"/>
  <!-- mold spot 2 -->
  <circle cx="38" cy="92" r="6" fill="#5a8a3a" stroke="#000" stroke-width="3"/>
  <circle cx="38" cy="92" r="2" fill="#1a4818"/>
  <!-- big angry-tired comic eyes -->
  <ellipse cx="44" cy="68" rx="9" ry="11" fill="#fff" stroke="#000" stroke-width="4"/>
  <ellipse cx="84" cy="68" rx="9" ry="11" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="44" cy="72" r="5" fill="#000"/>
  <circle cx="84" cy="72" r="5" fill="#000"/>
  <circle cx="46" cy="70" r="2" fill="#fff"/>
  <circle cx="86" cy="70" r="2" fill="#fff"/>
  <!-- droopy bushy eyebrows -->
  <path d="M 30 56 Q 38 58 50 62 L 52 64 L 50 60 Q 38 54 30 56 Z" fill="#1a1108"/>
  <path d="M 78 64 Q 90 58 98 56 Q 90 54 78 60 L 76 64 Z" fill="#1a1108"/>
  <!-- frown -->
  <path d="M 42 96 Q 64 88 86 96 Q 64 94 42 96 Z" fill="#000"/>
  <!-- speech burst with the WORD -->
  <g transform="translate(82 8)">
    <polygon points="0,12 6,4 14,8 22,2 28,12 34,4 38,12 32,18 38,22 30,26 34,32 24,28 18,34 12,28 4,32 6,22 -2,18" fill="#ffd24a" stroke="#000" stroke-width="3"/>
    <text x="18" y="22" text-anchor="middle" font-family="Impact, sans-serif" font-size="10" font-weight="bold" fill="#000">STALE!</text>
  </g>
  <!-- date stamp tag (comic style) -->
  <g transform="rotate(-12 28 110)">
    <rect x="8" y="100" width="40" height="16" fill="#c8302c" stroke="#000" stroke-width="3"/>
    <text x="28" y="111" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" fill="#fff">2-YR-OLD</text>
  </g>
</svg>
