<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- STALE BEAN — old, dusty coffee bean -->
  <ellipse cx="32" cy="58" rx="18" ry="2.5" fill="#1a1108" opacity="0.35"/>
  <!-- dust motes -->
  <circle cx="10" cy="14" r="1.5" fill="#a89878" opacity="0.6"/>
  <circle cx="54" cy="18" r="1" fill="#a89878" opacity="0.5"/>
  <circle cx="50" cy="8" r="1.2" fill="#a89878" opacity="0.4"/>
  <circle cx="14" cy="6" r="0.8" fill="#a89878" opacity="0.5"/>
  <!-- bean body -->
  <ellipse cx="32" cy="34" rx="22" ry="24" fill="#7a6248" stroke="#3d2817" stroke-width="2.5"/>
  <ellipse cx="28" cy="28" rx="9" ry="6" fill="#9a8265" opacity="0.5"/>
  <!-- center crease -->
  <path d="M 32 14 Q 26 34 32 54" fill="none" stroke="#3d2817" stroke-width="3"/>
  <path d="M 32 14 Q 28 34 32 54" fill="none" stroke="#3d2817" stroke-width="1" opacity="0.4"/>
  <!-- cobwebs -->
  <path d="M 12 18 L 22 24 M 12 18 L 16 28" stroke="#d0c0a0" stroke-width="0.6" opacity="0.6"/>
  <path d="M 52 14 L 44 22 M 52 14 L 50 24" stroke="#d0c0a0" stroke-width="0.6" opacity="0.6"/>
  <!-- mold spot -->
  <circle cx="44" cy="42" r="3" fill="#5a7a4a" opacity="0.6"/>
  <circle cx="44" cy="42" r="1.5" fill="#3a5a2a" opacity="0.7"/>
  <!-- sad face -->
  <ellipse cx="22" cy="36" rx="1.8" ry="2.5" fill="#1a1108"/>
  <ellipse cx="42" cy="36" rx="1.8" ry="2.5" fill="#1a1108"/>
  <path d="M 22 46 Q 32 42 42 46" fill="none" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- "STALE" stamp -->
  <text x="32" y="22" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#3d2817" opacity="0.7">STALE</text>
</svg>
