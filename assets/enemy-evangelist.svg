<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- PRE-GROUND BAG: grinding multiplies surface area ~10,000×; aromatic compounds gas off in HOURS, not weeks. -->
  <ellipse cx="64" cy="120" rx="40" ry="4" fill="#1a1108" opacity="0.4"/>
  <!-- speed lines (it's fast) -->
  <line x1="2" y1="44" x2="20" y2="44" stroke="#fff" stroke-width="2.5" opacity="0.5"/>
  <line x1="0" y1="62" x2="22" y2="62" stroke="#fff" stroke-width="2.5" opacity="0.5"/>
  <line x1="2" y1="80" x2="20" y2="80" stroke="#fff" stroke-width="2.5" opacity="0.5"/>
  <!-- spilled grounds trail behind -->
  <circle cx="14" cy="112" r="3" fill="#3d2817"/>
  <circle cx="22" cy="106" r="2.5" fill="#5c3a1c"/>
  <circle cx="10" cy="100" r="2" fill="#3d2817"/>
  <circle cx="18" cy="92" r="1.8" fill="#5c3a1c"/>
  <circle cx="6" cy="84" r="1.5" fill="#3d2817"/>
  <!-- mylar bag body (silver) -->
  <path d="M 28 24 L 28 108 Q 28 116 36 116 L 92 116 Q 100 116 100 108 L 100 24 L 92 16 L 36 16 Z" fill="#c0c0c0" stroke="#1a1108" stroke-width="3"/>
  <!-- shine on bag -->
  <path d="M 36 24 L 36 108" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <path d="M 44 28 L 44 102" stroke="#888" stroke-width="1" opacity="0.5"/>
  <path d="M 88 26 L 88 106" stroke="#888" stroke-width="1.5" opacity="0.5"/>
  <!-- zipper top -->
  <rect x="28" y="16" width="72" height="8" fill="#444" stroke="#1a1108" stroke-width="2"/>
  <path d="M 30 16 L 36 8 L 42 16 L 48 8 L 54 16 L 60 8 L 66 16 L 72 8 L 78 16 L 84 8 L 90 16 L 96 8" stroke="#1a1108" stroke-width="1.5" fill="none"/>
  <!-- red product label -->
  <rect x="36" y="40" width="56" height="48" fill="#c8302c" stroke="#1a1108" stroke-width="2"/>
  <text x="64" y="54" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fff">PRE-GROUND</text>
  <!-- defect details on label -->
  <line x1="42" y1="58" x2="86" y2="58" stroke="#fff" stroke-width="0.8"/>
  <text x="64" y="68" text-anchor="middle" font-family="monospace" font-size="6" fill="#fff">SURFACE 10,000x</text>
  <text x="64" y="76" text-anchor="middle" font-family="monospace" font-size="6" fill="#fff">OXIDIZES IN</text>
  <text x="64" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fff">HOURS!</text>
  <!-- visible exposed grounds at bottom of bag -->
  <rect x="36" y="92" width="56" height="20" fill="#3d2817" stroke="#1a1108" stroke-width="1.5" opacity="0.95"/>
  <circle cx="44" cy="100" r="1.5" fill="#1a1108"/>
  <circle cx="52" cy="105" r="1.2" fill="#1a1108"/>
  <circle cx="62" cy="98" r="1.4" fill="#1a1108"/>
  <circle cx="72" cy="106" r="1.3" fill="#1a1108"/>
  <circle cx="82" cy="100" r="1.5" fill="#1a1108"/>
  <circle cx="56" cy="108" r="1" fill="#1a1108"/>
  <circle cx="78" cy="94" r="1" fill="#1a1108"/>
  <!-- O2 attack arrows from sides -->
  <text x="14" y="60" font-family="sans-serif" font-size="11" font-weight="bold" fill="#88aaff">O2</text>
  <path d="M 24 60 L 34 56" stroke="#88aaff" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <text x="106" y="58" font-family="sans-serif" font-size="11" font-weight="bold" fill="#88aaff">O2</text>
  <path d="M 102 58 L 92 54" stroke="#88aaff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <polygon points="92,54 96,52 95,57" fill="#88aaff"/>
  <polygon points="34,56 30,54 31,59" fill="#88aaff"/>
  <!-- angry small eyes (peering over bag) -->
  <circle cx="48" cy="32" r="2.5" fill="#fff"/>
  <circle cx="80" cy="32" r="2.5" fill="#fff"/>
  <circle cx="48" cy="32" r="1.4" fill="#1a1108"/>
  <circle cx="80" cy="32" r="1.4" fill="#1a1108"/>
  <!-- nutrition / warning corner -->
  <rect x="100" y="100" width="22" height="14" fill="#000" stroke="#fff" stroke-width="0.8"/>
  <text x="111" y="108" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#fff">EXP</text>
  <text x="111" y="113" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#ff4444">2024</text>
</svg>
