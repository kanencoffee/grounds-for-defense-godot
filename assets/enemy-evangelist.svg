<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PRE-GROUND BAG — supermarket pre-ground coffee, fast -->
  <ellipse cx="32" cy="60" rx="18" ry="2" fill="#1a1108" opacity="0.35"/>
  <!-- spilling grounds trail -->
  <circle cx="8" cy="56" r="1.5" fill="#3d2817"/>
  <circle cx="14" cy="52" r="1.2" fill="#5c3a1c"/>
  <circle cx="6" cy="50" r="1" fill="#3d2817"/>
  <circle cx="12" cy="46" r="0.8" fill="#5c3a1c"/>
  <!-- bag body — silver mylar with red panel -->
  <path d="M 14 12 L 14 52 Q 14 56 18 56 L 46 56 Q 50 56 50 52 L 50 12 L 46 8 L 18 8 Z" fill="#c0c0c0" stroke="#1a1108" stroke-width="2"/>
  <!-- silver shine -->
  <path d="M 18 12 L 18 52" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <path d="M 22 14 L 22 50" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <!-- top zipper / opening -->
  <rect x="14" y="8" width="36" height="4" fill="#444" stroke="#1a1108" stroke-width="1"/>
  <path d="M 14 8 L 18 4 L 22 8 L 26 4 L 30 8 L 34 4 L 38 8 L 42 4 L 46 8" stroke="#1a1108" stroke-width="0.8" fill="none"/>
  <!-- red label -->
  <rect x="18" y="22" width="28" height="22" fill="#c8302c" stroke="#1a1108" stroke-width="1.5"/>
  <text x="32" y="32" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff">PRE-</text>
  <text x="32" y="40" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff">GROUND</text>
  <!-- visible grounds at bottom -->
  <rect x="18" y="46" width="28" height="6" fill="#3d2817" opacity="0.85"/>
  <circle cx="22" cy="49" r="0.8" fill="#1a1108"/>
  <circle cx="30" cy="50" r="0.7" fill="#1a1108"/>
  <circle cx="40" cy="49" r="0.8" fill="#1a1108"/>
  <!-- angry eyes (small for speed/agility look) -->
  <circle cx="26" cy="16" r="1.5" fill="#fff"/>
  <circle cx="38" cy="16" r="1.5" fill="#fff"/>
  <circle cx="26" cy="16" r="0.8" fill="#1a1108"/>
  <circle cx="38" cy="16" r="0.8" fill="#1a1108"/>
  <!-- speed lines -->
  <line x1="2" y1="22" x2="10" y2="22" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="32" x2="10" y2="32" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="2" y1="42" x2="10" y2="42" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
</svg>
