<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- MANIC GRINDER — possessed burr-grinder appliance with crazy eyes flinging stale grounds -->
  <defs>
    <radialGradient id="mg-body" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1a1a1a" stroke="#000" stroke-width="2"/>
    </radialGradient>
    <radialGradient id="mg-glass" cx="0.5" cy="0.4">
      <stop offset="0" stop-color="#5c3a1c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3d2817" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="120" rx="38" ry="4" fill="#3d2817" opacity="0.5"/>
  <!-- FLYING GROUNDS (chaotic explosion outward) -->
  <circle cx="14" cy="28" r="2.5" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="22" cy="14" r="2" fill="#5c3a1c" stroke="#1a1108" stroke-width="1"/>
  <circle cx="6" cy="50" r="2.2" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="106" cy="22" r="2.4" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="118" cy="38" r="2" fill="#5c3a1c" stroke="#1a1108" stroke-width="1"/>
  <circle cx="116" cy="60" r="2" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="100" cy="6" r="1.5" fill="#5c3a1c"/>
  <circle cx="20" cy="6" r="1.5" fill="#3d2817"/>
  <!-- HOPPER (top, glass with grounds) -->
  <path d="M 38 14 L 44 42 L 84 42 L 90 14 Z" fill="url(#mg-glass)"/>
  <path d="M 38 14 L 44 42 L 84 42 L 90 14 Z" fill="none" stroke="#1a1108" stroke-width="2"/>
  <!-- glass shine -->
  <path d="M 44 16 L 50 38" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- HOPPER LID (open, askew - "manic") -->
  <ellipse cx="64" cy="14" rx="28" ry="3" fill="#1a1108" stroke="#000" stroke-width="1.8"/>
  <!-- grounds inside hopper -->
  <rect x="46" y="32" width="36" height="10" fill="#3d2817"/>
  <circle cx="52" cy="36" r="1" fill="#1a1108"/>
  <circle cx="62" cy="38" r="1" fill="#1a1108"/>
  <circle cx="74" cy="36" r="1" fill="#1a1108"/>
  <!-- BODY (main grinder housing) -->
  <rect x="32" y="42" width="64" height="48" fill="url(#mg-body)" stroke="#1a1108" stroke-width="2"/>
  <!-- ribbed metal panels -->
  <line x1="32" y1="56" x2="96" y2="56" stroke="#1a1108" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="68" x2="96" y2="68" stroke="#1a1108" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="80" x2="96" y2="80" stroke="#1a1108" stroke-width="1" opacity="0.6"/>
  <!-- CRAZY EYES (the manic part) -->
  <ellipse cx="48" cy="60" rx="9" ry="11" fill="#fff" stroke="#1a1108" stroke-width="2.5"/>
  <ellipse cx="80" cy="60" rx="9" ry="11" fill="#fff" stroke="#1a1108" stroke-width="2.5"/>
  <!-- bulging googly pupils (different sizes — wonky) -->
  <circle cx="50" cy="62" r="4" fill="#1a1108"/>
  <circle cx="78" cy="58" r="4" fill="#1a1108"/>
  <circle cx="51" cy="60" r="1.2" fill="#fff"/>
  <circle cx="79" cy="56" r="1.2" fill="#fff"/>
  <!-- bloodshot veins -->
  <path d="M 40 54 Q 44 56 46 56" stroke="#c8302c" stroke-width="0.6" fill="none"/>
  <path d="M 88 56 Q 84 58 82 58" stroke="#c8302c" stroke-width="0.6" fill="none"/>
  <!-- maniacal grin -->
  <path d="M 42 78 Q 64 92 86 78 Q 64 86 42 78 Z" fill="#1a1108"/>
  <!-- teeth -->
  <line x1="46" y1="82" x2="46" y2="86" stroke="#fff" stroke-width="1.5"/>
  <line x1="54" y1="84" x2="54" y2="89" stroke="#fff" stroke-width="1.5"/>
  <line x1="64" y1="84" x2="64" y2="89" stroke="#fff" stroke-width="1.5"/>
  <line x1="74" y1="84" x2="74" y2="88" stroke="#fff" stroke-width="1.5"/>
  <line x1="82" y1="82" x2="82" y2="86" stroke="#fff" stroke-width="1.5"/>
  <!-- COLLECTOR JAR (bottom) overflowing -->
  <rect x="40" y="90" width="48" height="22" fill="#5c3a1c" stroke="#1a1108" stroke-width="2"/>
  <ellipse cx="64" cy="90" rx="24" ry="3" fill="#3d2817" stroke="#1a1108" stroke-width="1.5"/>
  <!-- grounds spilling out -->
  <circle cx="34" cy="98" r="2" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="32" cy="106" r="2.5" fill="#5c3a1c" stroke="#1a1108" stroke-width="1"/>
  <circle cx="94" cy="100" r="2.2" fill="#3d2817" stroke="#1a1108" stroke-width="1"/>
  <circle cx="96" cy="108" r="2" fill="#5c3a1c" stroke="#1a1108" stroke-width="1"/>
  <!-- power switch — ON, glowing red -->
  <circle cx="20" cy="62" r="3" fill="#c8302c" stroke="#1a1108" stroke-width="1.5"/>
  <circle cx="20" cy="62" r="1.5" fill="#ff6040"/>
  <!-- shake/vibration lines (it's running uncontrolled) -->
  <path d="M 26 50 L 22 54 M 102 50 L 106 54" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <path d="M 26 80 L 22 84 M 102 80 L 106 84" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
</svg>
