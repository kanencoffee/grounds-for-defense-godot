<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- GRIND ZERO — silver bag with red label, spilling grounds, speed lines -->
  <defs>
    <pattern id="ht-grind" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1" fill="#000" opacity="0.4"/>
    </pattern>
  </defs>
  <ellipse cx="64" cy="120" rx="38" ry="4" fill="#000" opacity="0.6"/>
  <!-- speed lines (left side, action!) -->
  <line x1="2" y1="40" x2="22" y2="38" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="0" y1="60" x2="20" y2="58" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="2" y1="80" x2="22" y2="78" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- spilled grounds trail -->
  <circle cx="14" cy="112" r="4" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <circle cx="22" cy="104" r="3" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <circle cx="8" cy="98" r="3" fill="#3d2817" stroke="#000" stroke-width="2.5"/>
  <circle cx="18" cy="88" r="2.5" fill="#3d2817" stroke="#000" stroke-width="2"/>
  <!-- bag body — flat silver -->
  <path d="M 28 22 L 28 110 Q 28 116 36 116 L 92 116 Q 100 116 100 110 L 100 22 L 92 14 L 36 14 Z" fill="#c0c0c0" stroke="#000" stroke-width="5"/>
  <!-- shadow on right side -->
  <path d="M 100 22 L 92 14 L 92 116 Q 100 116 100 110 Z" fill="#888"/>
  <path d="M 100 22 L 92 14 L 92 116 Q 100 116 100 110 Z" fill="url(#ht-grind)"/>
  <!-- highlight stripe -->
  <rect x="36" y="22" width="6" height="80" fill="#fff" opacity="0.85"/>
  <!-- zipper -->
  <rect x="28" y="14" width="72" height="8" fill="#444" stroke="#000" stroke-width="3"/>
  <path d="M 30 14 L 36 6 L 42 14 L 48 6 L 54 14 L 60 6 L 66 14 L 72 6 L 78 14 L 84 6 L 90 14 L 96 6" stroke="#000" stroke-width="2.5" fill="none"/>
  <!-- HUGE red label -->
  <rect x="36" y="38" width="56" height="48" fill="#c8302c" stroke="#000" stroke-width="4"/>
  <text x="64" y="60" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="13" font-weight="900" fill="#fff">PRE-</text>
  <text x="64" y="76" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="13" font-weight="900" fill="#fff">GROUND</text>
  <!-- exposed grounds at bottom -->
  <rect x="36" y="92" width="56" height="20" fill="#3d2817" stroke="#000" stroke-width="3"/>
  <circle cx="44" cy="100" r="2" fill="#000"/>
  <circle cx="56" cy="105" r="2" fill="#000"/>
  <circle cx="68" cy="98" r="2" fill="#000"/>
  <circle cx="80" cy="106" r="2" fill="#000"/>
  <!-- comic burst -->
  <g transform="translate(76 -2)">
    <polygon points="0,12 6,2 14,8 22,0 28,12 34,2 40,12 36,18 42,22 32,26 38,32 26,28 18,36 14,28 4,32 6,22 -4,18" fill="#ffd24a" stroke="#000" stroke-width="3"/>
    <text x="20" y="22" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" font-weight="bold" fill="#000">FAST!</text>
  </g>
</svg>
